# Fetches the Samsung AP firmware for a target via Samsung FUS (direct HTTP),
# extracts the vendor_dlkm image, mounts it, reads symbol offsets from the
# relevant .ko files, and commits the updated target.h back to main so the
# rebuild-artifacts workflow can consume it.
#
# No third-party Python packages required — uses only stdlib (urllib, hashlib,
# hmac, xml.etree) plus curl/lz4/simg2img from apt.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Triggers                                                               │
# │  workflow_dispatch:  manual run, one target at a time                  │
# │  push (workflow file only): registers workflow in Actions UI            │
# │  issues (closed):   firmware-fetch label → runs for default target     │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Secrets required: none (Samsung FUS is unauthenticated for latest firmware)
# Permissions: contents:write, issues:write

name: Fetch firmware offsets

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Samsung model number (e.g. SM-S936U1)'
        required: false
        default: 'SM-S936U1'
      region:
        description: 'Region / CSC (e.g. XAA, TMB)'
        required: false
        default: 'XAA'
      firmware_version:
        description: >
          Full PDA/firmware version string (e.g. S936U1UESCCZF9).
          Leave blank to fetch the latest available version.
        required: false
        default: ''
      target:
        description: >
          Build-system target name inside src/targets/ (e.g. pa2q-S936U1UEUCZZHL).
          Must match the directory that contains target.h.
        required: false
        default: 'pa2q-S936U1UEUCZZHL'
      auto_trigger_rebuild:
        description: 'Open an exploit-rebuild issue after committing so rebuild-artifacts runs automatically'
        required: false
        default: 'true'
  push:
    paths:
      - '.github/workflows/fetch-firmware-offsets.yml'
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write

# ─────────────────────────────────────────────────────────────────────────────
# GATE — decide whether to run and resolve firmware version
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run:              ${{ steps.decide.outputs.run }}
      model:            ${{ steps.resolve.outputs.model }}
      region:           ${{ steps.resolve.outputs.region }}
      firmware_version: ${{ steps.resolve.outputs.firmware_version }}
      target:           ${{ steps.resolve.outputs.target }}
      auto_trigger:     ${{ steps.resolve.outputs.auto_trigger }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide whether to run
        id: decide
        env:
          EVENT:        ${{ github.event_name }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            # push trigger exists only to register the workflow in the Actions UI
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Push trigger fired — skipping actual run (registration only)."
          else
            HAS=$(echo "$ISSUE_LABELS" | jq -r '[.[].name] | index("firmware-fetch") != null')
            echo "run=$HAS" >> "$GITHUB_OUTPUT"
            [ "$HAS" != "true" ] && echo "No firmware-fetch label — skipping."
          fi

      - name: Write FUS client library
        if: steps.decide.outputs.run == 'true'
        run: |
          cat > /tmp/fus.py << 'PYEOF'
import urllib.request, urllib.parse, hashlib, hmac, base64, os, re

FUS_HOST   = "https://cloud-neofus.samsungmobile.com"
USER_AGENT = "Dalvik/2.1.0 (Linux; U; Android 12; SM-G991B Build/SP1A.210812.016)"

_K1 = "vicopx7dqu06em2f"
_K2 = "waxd789d2eonk84g"

def _derive(nonce):
    key = ""
    for i in range(16):
        x = ord(nonce[i])
        key += _K1[x % 16] if i % 2 == 0 else _K2[x % 16]
    return key

def _getauth(nonce):
    key   = _derive(nonce)
    hm    = hmac.new(key.encode(), nonce.encode(), hashlib.md5).digest()
    token = base64.b64encode(hm).decode()
    return "nonce={};signature={};nc=1;type=2;".format(nonce, urllib.parse.quote(token))

def _post(path, body, auth=""):
    # type: (str, str, str) -> tuple
    url  = FUS_HOST + path
    req  = urllib.request.Request(url, data=body.encode(), method="POST")
    req.add_header("Content-Type", "application/xml")
    req.add_header("User-Agent",   USER_AGENT)
    if auth:
        req.add_header("Authorization", auth)
    with urllib.request.urlopen(req, timeout=30) as r:
        nonce = r.getheader("NONCE", "")
        text  = r.read().decode(errors="replace")
    return text, nonce

def _xml(text, tag):
    m = re.search(r"<{}>(.*?)</{}>".format(tag, tag), text, re.S)
    return m.group(1).strip() if m else ""

def get_nonce():
    body = '<?xml version="1.0" encoding="UTF-8"?><FUSMsg><FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr><FUSBody/></FUSMsg>'
    resp, nonce = _post("/NF_DownloadGenerateNonce.do", body)
    if not nonce:
        nonce = _xml(resp, "NONCE")
    if not nonce:
        raise RuntimeError("Could not obtain FUS nonce — Samsung may have changed their API")
    return nonce

def get_latest_version(model, region):
    nonce = get_nonce()
    auth  = _getauth(nonce)
    body  = (
        '<?xml version="1.0" encoding="UTF-8">'
        "<FUSMsg><FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr>"
        "<FUSBody><Put>"
        "<ACCESS_MODE><Data>2</Data></ACCESS_MODE>"
        "<BINARY_NATURE><Data>1</Data></BINARY_NATURE>"
        "<CLIENT_PRODUCT><Data>Smart Switch</Data></CLIENT_PRODUCT>"
        "<DEVICE_MODEL_BLUETOOTH><Data>{}</Data></DEVICE_MODEL_BLUETOOTH>"
        "<DEVICE_MODEL_TYPE><Data>1</Data></DEVICE_MODEL_TYPE>"
        "<COUNTRY_CODE><Data>{}</Data></COUNTRY_CODE>"
        "<LOGIC_CHECK><Data></Data></LOGIC_CHECK>"
        "</Put></FUSBody></FUSMsg>"
    ).format(model, region)
    resp, _ = _post("/NF_DownloadBinaryInform.do", body, auth)
    v = _xml(resp, "LATEST_FW_VERSION") or _xml(resp, "CURRENT_OS_VERSION")
    return v.strip("/ \n")

def get_binary_info(model, region, version):
    nonce  = get_nonce()
    auth   = _getauth(nonce)
    suffix = version[-16:] if len(version) >= 16 else version
    lc     = "".join(chr(ord(a) ^ ord(b)) for a, b in zip(suffix, nonce[:len(suffix)]))
    body   = (
        '<?xml version="1.0" encoding="UTF-8"?>'
        "<FUSMsg><FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr>"
        "<FUSBody><Put>"
        "<ACCESS_MODE><Data>2</Data></ACCESS_MODE>"
        "<BINARY_NATURE><Data>1</Data></BINARY_NATURE>"
        "<CLIENT_PRODUCT><Data>Smart Switch</Data></CLIENT_PRODUCT>"
        "<DEVICE_MODEL_BLUETOOTH><Data>{model}</Data></DEVICE_MODEL_BLUETOOTH>"
        "<DEVICE_MODEL_TYPE><Data>1</Data></DEVICE_MODEL_TYPE>"
        "<DEVICE_LOCAL_CODE><Data>{region}</Data></DEVICE_LOCAL_CODE>"
        "<DEVICE_FW_VERSION><Data>{version}</Data></DEVICE_FW_VERSION>"
        "<BINARY_FILE_TYPE><Data>AP</Data></BINARY_FILE_TYPE>"
        "<LOGIC_CHECK><Data>{lc}</Data></LOGIC_CHECK>"
        "</Put></FUSBody></FUSMsg>"
    ).format(model=model, region=region, version=version, lc=lc)
    resp, new_nonce = _post("/NF_DownloadBinaryInform.do", body, auth)
    filename = _xml(resp, "BINARY_NAME")
    filepath = _xml(resp, "MODEL_PATH")
    filesize = _xml(resp, "BINARY_BYTE_SIZE")
    if not filename:
        raise RuntimeError("BinaryInform returned no filename:\n" + resp[:600])
    new_auth = _getauth(new_nonce) if new_nonce else auth
    return {"filename": filename, "path": filepath,
            "size": int(filesize or 0), "auth": new_auth}

def download_ap(model, region, version, outdir):
    info     = get_binary_info(model, region, version)
    fname    = info["filename"]
    fpath    = info["path"]
    filesize = info["size"]
    auth     = info["auth"]
    os.makedirs(outdir, exist_ok=True)
    enc_path = os.path.join(outdir, fname)
    out_path = enc_path.rsplit(".", 1)[0] if fname.endswith((".enc4", ".enc2")) else enc_path

    print("Downloading {}  ({} MB)...".format(fname, filesize // 1024 // 1024), flush=True)

    init_body = (
        '<?xml version="1.0" encoding="UTF-8"?>'
        "<FUSMsg><FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr>"
        "<FUSBody><Put>"
        "<ACCESS_MODE><Data>2</Data></ACCESS_MODE>"
        "<BINARY_FILE_TYPE><Data>AP</Data></BINARY_FILE_TYPE>"
        "<BINARY_NATURE><Data>1</Data></BINARY_NATURE>"
        "<CLIENT_PRODUCT><Data>Smart Switch</Data></CLIENT_PRODUCT>"
        "<DEVICE_MODEL_BLUETOOTH><Data>{model}</Data></DEVICE_MODEL_BLUETOOTH>"
        "<DEVICE_LOCAL_CODE><Data>{region}</Data></DEVICE_LOCAL_CODE>"
        "<DEVICE_FW_VERSION><Data>{version}</Data></DEVICE_FW_VERSION>"
        "<FILENAME><Data>{fname}</Data></FILENAME>"
        "<MODEL_PATH><Data>{fpath}</Data></MODEL_PATH>"
        "<LOGIC_CHECK><Data></Data></LOGIC_CHECK>"
        "</Put></FUSBody></FUSMsg>"
    ).format(model=model, region=region, version=version, fname=fname, fpath=fpath)
    _post("/NF_DownloadBinaryInitForMass.do", init_body, auth)

    dl_url = FUS_HOST + "/NF_DownloadBinaryForMass.do?" + urllib.parse.urlencode({"file": fpath + fname})
    req = urllib.request.Request(dl_url)
    req.add_header("Authorization", auth)
    req.add_header("User-Agent", USER_AGENT)
    chunk = 1 << 20
    downloaded = 0
    last_pct   = -1
    with urllib.request.urlopen(req, timeout=600) as r, open(enc_path, "wb") as f:
        while True:
            buf = r.read(chunk)
            if not buf:
                break
            f.write(buf)
            downloaded += len(buf)
            if filesize:
                pct = downloaded * 100 // filesize
                if pct != last_pct and pct % 10 == 0:
                    print("  {}%  ({}/{} MB)".format(pct, downloaded // 1024 // 1024, filesize // 1024 // 1024), flush=True)
                    last_pct = pct
    print("Download complete: " + enc_path, flush=True)

    if fname.endswith(".enc4"):
        from Crypto.Cipher import AES
        key = hashlib.md5(version[-16:].encode()).digest() + hashlib.md5(version[:16].encode()).digest()
        iv  = key[:16]
        with open(enc_path, "rb") as f:
            data = f.read()
        with open(out_path, "wb") as f:
            f.write(AES.new(key, AES.MODE_CBC, iv).decrypt(data))
        os.remove(enc_path)
        print("Decrypted enc4 -> " + out_path, flush=True)
    elif fname.endswith(".enc2"):
        from Crypto.Cipher import AES
        KEY = bytes(range(32))
        with open(enc_path, "rb") as f:
            data = f.read()
        with open(out_path, "wb") as f:
            f.write(AES.new(KEY, AES.MODE_ECB).decrypt(data))
        os.remove(enc_path)
        print("Decrypted enc2 -> " + out_path, flush=True)

    return out_path

if __name__ == "__main__":
    import sys
    cmd = sys.argv[1] if len(sys.argv) > 1 else ""
    if cmd == "latest":
        _, _, model, region = sys.argv
        print(get_latest_version(model, region))
    elif cmd == "download":
        _, _, model, region, version, outdir = sys.argv
        download_ap(model, region, version, outdir)
    else:
        print("Usage: python3 fus.py latest MODEL REGION")
        print("       python3 fus.py download MODEL REGION VERSION OUTDIR")
        sys.exit(1)
PYEOF
          echo "FUS client written to /tmp/fus.py"

      - name: Resolve parameters
        id: resolve
        if: steps.decide.outputs.run == 'true'
        env:
          INPUT_MODEL:   ${{ inputs.model }}
          INPUT_REGION:  ${{ inputs.region }}
          INPUT_FW:      ${{ inputs.firmware_version }}
          INPUT_TARGET:  ${{ inputs.target }}
          INPUT_TRIGGER: ${{ inputs.auto_trigger_rebuild }}
          EVENT:         ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "issues" ]; then
            MODEL="SM-S936U1"
            REGION="XAA"
            FW=""
            TARGET="pa2q-S936U1UEUCZZHL"
            TRIGGER="true"
          else
            MODEL="${INPUT_MODEL:-SM-S936U1}"
            REGION="${INPUT_REGION:-XAA}"
            FW="${INPUT_FW:-}"
            TARGET="${INPUT_TARGET:-pa2q-S936U1UEUCZZHL}"
            TRIGGER="${INPUT_TRIGGER:-true}"
          fi

          if [ -z "$FW" ]; then
            echo "No firmware version supplied — querying FUS for $MODEL/$REGION..."
            FW=$(python3 /tmp/fus.py latest "$MODEL" "$REGION" 2>&1 | tail -1 || echo "")
            echo "Latest firmware version resolved: $FW"
          fi

          if [ -z "$FW" ]; then
            echo "::error::Could not resolve firmware version for $MODEL/$REGION"
            exit 1
          fi

          echo "model=$MODEL"            >> "$GITHUB_OUTPUT"
          echo "region=$REGION"          >> "$GITHUB_OUTPUT"
          echo "firmware_version=$FW"    >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"          >> "$GITHUB_OUTPUT"
          echo "auto_trigger=$TRIGGER"   >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# FETCH — download AP, extract modules, derive offsets, update target.h
# ─────────────────────────────────────────────────────────────────────────────
  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      MODEL:  ${{ needs.gate.outputs.model }}
      REGION: ${{ needs.gate.outputs.region }}
      FW:     ${{ needs.gate.outputs.firmware_version }}
      TARGET: ${{ needs.gate.outputs.target }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            lz4 \
            android-sdk-libsparse-utils \
            python3-pip \
            jq
          pip install --quiet pycryptodome || true

      - name: Write FUS client library
        run: |
          cat > /tmp/fus.py << 'PYEOF'
