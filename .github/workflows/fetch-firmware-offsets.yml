# Fetches the Samsung AP firmware for a target via Samsung FUS (direct HTTP),
# extracts the vendor_dlkm image, mounts it, reads symbol offsets from the
# relevant .ko files, and commits the updated target.h back to main so the
# rebuild-artifacts workflow can consume it.
#
# No third-party Python packages required — uses only stdlib (urllib, hashlib,
# hmac, xml.etree) plus curl/lz4/simg2img from apt.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Triggers                                                               │
# │  workflow_dispatch:  manual run, one target at a time                  │
# │  issues (closed):   firmware-fetch label → runs for default target     │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Secrets required: none (Samsung FUS is unauthenticated for latest firmware)
# Permissions: contents:write, issues:write

name: Fetch firmware offsets

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Samsung model number (e.g. SM-S936U1)'
        required: false
        default: 'SM-S936U1'
      region:
        description: 'Region / CSC (e.g. XAA, TMB)'
        required: false
        default: 'XAA'
      firmware_version:
        description: >
          Full PDA/firmware version string (e.g. S936U1UESCCZF9).
          Leave blank to fetch the latest available version.
        required: false
        default: ''
      target:
        description: >
          Build-system target name inside src/targets/ (e.g. pa2q-S936U1UEUCZZHL).
          Must match the directory that contains target.h.
        required: false
        default: 'pa2q-S936U1UEUCZZHL'
      auto_trigger_rebuild:
        description: 'Open an exploit-rebuild issue after committing so rebuild-artifacts runs automatically'
        required: false
        default: 'true'
        type: boolean
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write

# ─────────────────────────────────────────────────────────────────────────────
# Shared FUS client — written to /tmp/fus.py and sourced by both jobs.
# Pure Python 3 stdlib; no pip required.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# GATE — decide whether to run and resolve firmware version
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run:              ${{ steps.decide.outputs.run }}
      model:            ${{ steps.resolve.outputs.model }}
      region:           ${{ steps.resolve.outputs.region }}
      firmware_version: ${{ steps.resolve.outputs.firmware_version }}
      target:           ${{ steps.resolve.outputs.target }}
      auto_trigger:     ${{ steps.resolve.outputs.auto_trigger }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide whether to run
        id: decide
        env:
          EVENT:        ${{ github.event_name }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            HAS=$(echo "$ISSUE_LABELS" | jq -r '[.[].name] | index("firmware-fetch") != null')
            echo "run=$HAS" >> "$GITHUB_OUTPUT"
            [ "$HAS" != "true" ] && echo "No firmware-fetch label — skipping."
          fi

      - name: Write FUS client library
        if: steps.decide.outputs.run == 'true'
        run: |
          cat > /tmp/fus.py << 'PYEOF'
# Samsung FUS client — stdlib only (Python 3.6+)
# Implements: nonce acquisition → auth token → binary-info → chunked download
import urllib.request, urllib.parse, hashlib, hmac, base64, time, os, re
import xml.etree.ElementTree as ET

FUS_HOST  = "https://cloud-neofus.samsungmobile.com"
USER_AGENT = "Dalvik/2.1.0 (Linux; U; Android 12; SM-G991B Build/SP1A.210812.016)"

# ── Key derivation (reproduced from Samsung's auth spec) ─────────────────────
_K1 = "vicopx7dqu06em2f"
_K2 = "waxd789d2eonk84g"

def _derive(nonce: str) -> str:
    key = ""
    for i in range(16):
        c = nonce[i]
        x = ord(c)
        key += _K1[x % 16] if i % 2 == 0 else _K2[x % 16]
    return key

def _getauth(nonce: str) -> str:
    key   = _derive(nonce)
    hm    = hmac.new(key.encode(), nonce.encode(), hashlib.md5).digest()
    token = base64.b64encode(hm).decode()
    return f"nonce={nonce};signature={urllib.parse.quote(token)};nc=1;type=2;"

# ── HTTP helpers ──────────────────────────────────────────────────────────────
def _post(path: str, body: str, auth: str = "") -> tuple[str, str]:
    url  = FUS_HOST + path
    data = body.encode()
    req  = urllib.request.Request(url, data=data, method="POST")
    req.add_header("Content-Type",   "application/xml")
    req.add_header("User-Agent",     USER_AGENT)
    req.add_header("Accept-Encoding","gzip")
    if auth:
        req.add_header("Authorization", auth)
    with urllib.request.urlopen(req, timeout=30) as r:
        new_nonce = r.getheader("NONCE", "")
        text      = r.read().decode(errors="replace")
    return text, new_nonce

def _xml_val(text: str, tag: str) -> str:
    m = re.search(rf"<{tag}>(.*?)</{tag}>", text, re.S)
    return m.group(1).strip() if m else ""

# ── Public API ────────────────────────────────────────────────────────────────
def get_nonce() -> str:
    """Acquire a fresh nonce from FUS."""
    body = '<?xml version="1.0" encoding="UTF-8"?><FUSMsg><FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr><FUSBody/></FUSMsg>'
    _, nonce = _post("/NF_DownloadGenerateNonce.do", body)
    if not nonce:
        # Nonce may be embedded in response body for some regions
        resp, _ = _post("/NF_DownloadGenerateNonce.do", body)
        nonce = _xml_val(resp, "NONCE")
    if not nonce:
        raise RuntimeError("Could not obtain FUS nonce")
    return nonce

def get_latest_version(model: str, region: str) -> str:
    """Return the latest firmware version string for model/region."""
    nonce = get_nonce()
    auth  = _getauth(nonce)
    body  = f'''<?xml version="1.0" encoding="UTF-8"?>
<FUSMsg>
  <FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr>
  <FUSBody>
    <Put>
      <ACCESS_MODE><Data>2</Data></ACCESS_MODE>
      <BINARY_NATURE><Data>1</Data></BINARY_NATURE>
      <CLIENT_PRODUCT><Data>Smart Switch</Data></CLIENT_PRODUCT>
      <DEVICE_MODEL_BLUETOOTH><Data>{model}</Data></DEVICE_MODEL_BLUETOOTH>
      <DEVICE_MODEL_TYPE><Data>1</Data></DEVICE_MODEL_TYPE>
      <LOGIC_CHECK><Data></Data></LOGIC_CHECK>
      <COUNTRY_CODE><Data>{region}</Data></COUNTRY_CODE>
    </Put>
  </FUSBody>
</FUSMsg>'''
    resp, _ = _post("/NF_DownloadBinaryInform.do", body, auth)
    version = _xml_val(resp, "LATEST_FW_VERSION")
    if not version:
        version = _xml_val(resp, "CURRENT_OS_VERSION")
    return version.strip("/ \n")

def get_binary_info(model: str, region: str, version: str) -> dict:
    """Return filename, path, filesize, and crc for the AP binary."""
    nonce = get_nonce()
    auth  = _getauth(nonce)
    # Logic check: last 16 chars of version, XOR'd with nonce
    suffix = version[-16:] if len(version) >= 16 else version
    lc = "".join(chr(ord(a) ^ ord(b)) for a, b in zip(suffix, nonce[:len(suffix)]))
    body = f'''<?xml version="1.0" encoding="UTF-8"?>
<FUSMsg>
  <FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr>
  <FUSBody>
    <Put>
      <ACCESS_MODE><Data>2</Data></ACCESS_MODE>
      <BINARY_NATURE><Data>1</Data></BINARY_NATURE>
      <CLIENT_PRODUCT><Data>Smart Switch</Data></CLIENT_PRODUCT>
      <DEVICE_MODEL_BLUETOOTH><Data>{model}</Data></DEVICE_MODEL_BLUETOOTH>
      <DEVICE_MODEL_TYPE><Data>1</Data></DEVICE_MODEL_TYPE>
      <DEVICE_LOCAL_CODE><Data>{region}</Data></DEVICE_LOCAL_CODE>
      <DEVICE_FW_VERSION><Data>{version}</Data></DEVICE_FW_VERSION>
      <BINARY_FILE_TYPE><Data>AP</Data></BINARY_FILE_TYPE>
      <LOGIC_CHECK><Data>{lc}</Data></LOGIC_CHECK>
    </Put>
  </FUSBody>
</FUSMsg>'''
    resp, new_nonce = _post("/NF_DownloadBinaryInform.do", body, auth)
    filename = _xml_val(resp, "BINARY_NAME")
    filepath = _xml_val(resp, "MODEL_PATH")
    filesize = _xml_val(resp, "BINARY_BYTE_SIZE")
    crc32    = _xml_val(resp, "BINARY_CRC")
    if not filename:
        raise RuntimeError(f"BinaryInform returned no filename. Response:\n{resp[:800]}")
    # Refresh auth with the new nonce returned by Inform
    new_auth = _getauth(new_nonce) if new_nonce else auth
    return {"filename": filename, "path": filepath, "size": int(filesize or 0),
            "crc32": crc32, "auth": new_auth}

def download_ap(model: str, region: str, version: str, outdir: str) -> str:
    """Download and decrypt the AP tar. Returns path to the decrypted tar."""
    info = get_binary_info(model, region, version)
    fname    = info["filename"]
    fpath    = info["path"]
    filesize = info["size"]
    auth     = info["auth"]
    os.makedirs(outdir, exist_ok=True)
    enc_path = os.path.join(outdir, fname)
    out_path = enc_path.rsplit(".", 1)[0] if fname.endswith((".enc4", ".enc2")) else enc_path

    print(f"Downloading {fname}  ({filesize//1024//1024} MB)...", flush=True)

    # Init download session
    body = f'''<?xml version="1.0" encoding="UTF-8"?>
<FUSMsg>
  <FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr>
  <FUSBody>
    <Put>
      <ACCESS_MODE><Data>2</Data></ACCESS_MODE>
      <BINARY_FILE_TYPE><Data>AP</Data></BINARY_FILE_TYPE>
      <BINARY_NATURE><Data>1</Data></BINARY_NATURE>
      <CLIENT_PRODUCT><Data>Smart Switch</Data></CLIENT_PRODUCT>
      <DEVICE_MODEL_BLUETOOTH><Data>{model}</Data></DEVICE_MODEL_BLUETOOTH>
      <DEVICE_LOCAL_CODE><Data>{region}</Data></DEVICE_LOCAL_CODE>
      <DEVICE_FW_VERSION><Data>{version}</Data></DEVICE_FW_VERSION>
      <FILENAME><Data>{fname}</Data></FILENAME>
      <LOGIC_CHECK><Data></Data></LOGIC_CHECK>
      <MODEL_PATH><Data>{fpath}</Data></LOGIC_CHECK>
    </Put>
  </FUSBody>
</FUSMsg>'''
    _post("/NF_DownloadBinaryInitForMass.do", body, auth)

    # Stream download
    dl_url = FUS_HOST + "/NF_DownloadBinaryForMass.do?" + urllib.parse.urlencode({
        "file": fpath + fname
    })
    req = urllib.request.Request(dl_url)
    req.add_header("Authorization", auth)
    req.add_header("User-Agent", USER_AGENT)
    chunk = 1 << 20  # 1 MB
    downloaded = 0
    last_pct = -1
    with urllib.request.urlopen(req, timeout=300) as r, open(enc_path, "wb") as f:
        while True:
            buf = r.read(chunk)
            if not buf:
                break
            f.write(buf)
            downloaded += len(buf)
            if filesize:
                pct = downloaded * 100 // filesize
                if pct != last_pct and pct % 5 == 0:
                    print(f"  {pct}% ({downloaded//1024//1024}/{filesize//1024//1024} MB)", flush=True)
                    last_pct = pct
    print(f"Download complete: {enc_path}", flush=True)

    # Decrypt if needed
    if fname.endswith(".enc4"):
        _decrypt_enc4(enc_path, out_path, version)
        os.remove(enc_path)
    elif fname.endswith(".enc2"):
        _decrypt_enc2(enc_path, out_path)
        os.remove(enc_path)

    return out_path

# ── Decryption helpers ────────────────────────────────────────────────────────
def _decrypt_enc4(src: str, dst: str, version: str):
    """AES-CBC decrypt .enc4 using key derived from firmware version."""
    from Crypto.Cipher import AES  # pycryptodome — installed separately
    key = hashlib.md5(version[-16:].encode()).digest() + \
          hashlib.md5(version[:16].encode()).digest()
    iv  = key[:16]
    with open(src, "rb") as f:
        data = f.read()
    cipher = AES.new(key, AES.MODE_CBC, iv)
    with open(dst, "wb") as f:
        f.write(cipher.decrypt(data))
    print(f"Decrypted enc4 → {dst}", flush=True)

def _decrypt_enc2(src: str, dst: str):
    """AES-ECB decrypt .enc2 using the fixed Samsung key."""
    from Crypto.Cipher import AES
    KEY = bytes([0x00,0x01,0x02,0x03,0x04,0x05,0x06,0x07,
                 0x08,0x09,0x0a,0x0b,0x0c,0x0d,0x0e,0x0f,
                 0x10,0x11,0x12,0x13,0x14,0x15,0x16,0x17,
                 0x18,0x19,0x1a,0x1b,0x1c,0x1d,0x1e,0x1f])
    with open(src, "rb") as f:
        data = f.read()
    cipher = AES.new(KEY, AES.MODE_ECB)
    with open(dst, "wb") as f:
        f.write(cipher.decrypt(data))
    print(f"Decrypted enc2 → {dst}", flush=True)

if __name__ == "__main__":
    import sys
    cmd = sys.argv[1] if len(sys.argv) > 1 else ""
    if cmd == "latest":
        _, model, region = sys.argv
        print(get_latest_version(model, region))
    elif cmd == "download":
        _, _, model, region, version, outdir = sys.argv
        download_ap(model, region, version, outdir)
    else:
        print("Usage: fus.py latest MODEL REGION")
        print("       fus.py download MODEL REGION VERSION OUTDIR")
        sys.exit(1)
PYEOF
          echo "FUS client written to /tmp/fus.py"

      - name: Resolve parameters
        id: resolve
        if: steps.decide.outputs.run == 'true'
        env:
          INPUT_MODEL:   ${{ inputs.model }}
          INPUT_REGION:  ${{ inputs.region }}
          INPUT_FW:      ${{ inputs.firmware_version }}
          INPUT_TARGET:  ${{ inputs.target }}
          INPUT_TRIGGER: ${{ inputs.auto_trigger_rebuild }}
          EVENT:         ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "issues" ]; then
            MODEL="SM-S936U1"
            REGION="XAA"
            FW=""
            TARGET="pa2q-S936U1UEUCZZHL"
            TRIGGER="true"
          else
            MODEL="${INPUT_MODEL:-SM-S936U1}"
            REGION="${INPUT_REGION:-XAA}"
            FW="${INPUT_FW:-}"
            TARGET="${INPUT_TARGET:-pa2q-S936U1UEUCZZHL}"
            TRIGGER="${INPUT_TRIGGER:-true}"
          fi

          # If no explicit firmware version, query FUS directly
          if [ -z "$FW" ]; then
            echo "No firmware version supplied — querying FUS for $MODEL/$REGION..."
            FW=$(python3 /tmp/fus.py latest "$MODEL" "$REGION" 2>&1 | tail -1 || echo "")
            echo "Latest firmware version resolved: $FW"
          fi

          if [ -z "$FW" ]; then
            echo "::error::Could not resolve firmware version for $MODEL/$REGION"
            exit 1
          fi

          echo "model=$MODEL"            >> "$GITHUB_OUTPUT"
          echo "region=$REGION"          >> "$GITHUB_OUTPUT"
          echo "firmware_version=$FW"    >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"          >> "$GITHUB_OUTPUT"
          echo "auto_trigger=$TRIGGER"   >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# FETCH — download AP, extract modules, derive offsets, update target.h
# ─────────────────────────────────────────────────────────────────────────────
  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      MODEL:  ${{ needs.gate.outputs.model }}
      REGION: ${{ needs.gate.outputs.region }}
      FW:     ${{ needs.gate.outputs.firmware_version }}
      TARGET: ${{ needs.gate.outputs.target }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            lz4 \
            android-sdk-libsparse-utils \
            python3-pip \
            jq
          # pycryptodome is needed only for .enc4/.enc2 decryption
          # pip is available; fall back gracefully if enc files not present
          pip install --quiet pycryptodome || true

      - name: Write FUS client library
        run: |
          cat > /tmp/fus.py << 'PYEOF'
# Samsung FUS client — stdlib only (Python 3.6+)
# Implements: nonce acquisition → auth token → binary-info → chunked download
import urllib.request, urllib.parse, hashlib, hmac, base64, time, os, re
import xml.etree.ElementTree as ET

FUS_HOST  = "https://cloud-neofus.samsungmobile.com"
USER_AGENT = "Dalvik/2.1.0 (Linux; U; Android 12; SM-G991B Build/SP1A.210812.016)"

_K1 = "vicopx7dqu06em2f"
_K2 = "waxd789d2eonk84g"

def _derive(nonce: str) -> str:
    key = ""
    for i in range(16):
        c = nonce[i]
        x = ord(c)
        key += _K1[x % 16] if i % 2 == 0 else _K2[x % 16]
    return key

def _getauth(nonce: str) -> str:
    key   = _derive(nonce)
    hm    = hmac.new(key.encode(), nonce.encode(), hashlib.md5).digest()
    token = base64.b64encode(hm).decode()
    return f"nonce={nonce};signature={urllib.parse.quote(token)};nc=1;type=2;"

def _post(path: str, body: str, auth: str = "") -> tuple:
    url  = FUS_HOST + path
    data = body.encode()
    req  = urllib.request.Request(url, data=data, method="POST")
    req.add_header("Content-Type",   "application/xml")
    req.add_header("User-Agent",     USER_AGENT)
    if auth:
        req.add_header("Authorization", auth)
    with urllib.request.urlopen(req, timeout=30) as r:
        new_nonce = r.getheader("NONCE", "")
        text      = r.read().decode(errors="replace")
    return text, new_nonce

def _xml_val(text: str, tag: str) -> str:
    m = re.search(rf"<{tag}>(.*?)</{tag}>", text, re.S)
    return m.group(1).strip() if m else ""

def get_nonce() -> str:
    body = '<?xml version="1.0" encoding="UTF-8"?><FUSMsg><FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr><FUSBody/></FUSMsg>'
    resp, nonce = _post("/NF_DownloadGenerateNonce.do", body)
    if not nonce:
        nonce = _xml_val(resp, "NONCE")
    if not nonce:
        raise RuntimeError("Could not obtain FUS nonce — Samsung may have changed their API")
    return nonce

def get_latest_version(model: str, region: str) -> str:
    nonce = get_nonce()
    auth  = _getauth(nonce)
    body  = f'''<?xml version="1.0" encoding="UTF-8"?>
<FUSMsg>
  <FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr>
  <FUSBody><Put>
    <ACCESS_MODE><Data>2</Data></ACCESS_MODE>
    <BINARY_NATURE><Data>1</Data></BINARY_NATURE>
    <CLIENT_PRODUCT><Data>Smart Switch</Data></CLIENT_PRODUCT>
    <DEVICE_MODEL_BLUETOOTH><Data>{model}</Data></DEVICE_MODEL_BLUETOOTH>
    <DEVICE_MODEL_TYPE><Data>1</Data></DEVICE_MODEL_TYPE>
    <COUNTRY_CODE><Data>{region}</Data></COUNTRY_CODE>
    <LOGIC_CHECK><Data></Data></LOGIC_CHECK>
  </Put></FUSBody>
</FUSMsg>'''
    resp, _ = _post("/NF_DownloadBinaryInform.do", body, auth)
    v = _xml_val(resp, "LATEST_FW_VERSION") or _xml_val(resp, "CURRENT_OS_VERSION")
    return v.strip("/ \n")

def get_binary_info(model: str, region: str, version: str) -> dict:
    nonce = get_nonce()
    auth  = _getauth(nonce)
    suffix = version[-16:] if len(version) >= 16 else version
    lc = "".join(chr(ord(a) ^ ord(b)) for a, b in zip(suffix, nonce[:len(suffix)]))
    body = f'''<?xml version="1.0" encoding="UTF-8"?>
<FUSMsg>
  <FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr>
  <FUSBody><Put>
    <ACCESS_MODE><Data>2</Data></ACCESS_MODE>
    <BINARY_NATURE><Data>1</Data></BINARY_NATURE>
    <CLIENT_PRODUCT><Data>Smart Switch</Data></CLIENT_PRODUCT>
    <DEVICE_MODEL_BLUETOOTH><Data>{model}</Data></DEVICE_MODEL_BLUETOOTH>
    <DEVICE_MODEL_TYPE><Data>1</Data></DEVICE_MODEL_TYPE>
    <DEVICE_LOCAL_CODE><Data>{region}</Data></DEVICE_LOCAL_CODE>
    <DEVICE_FW_VERSION><Data>{version}</Data></DEVICE_FW_VERSION>
    <BINARY_FILE_TYPE><Data>AP</Data></BINARY_FILE_TYPE>
    <LOGIC_CHECK><Data>{lc}</Data></LOGIC_CHECK>
  </Put></FUSBody>
</FUSMsg>'''
    resp, new_nonce = _post("/NF_DownloadBinaryInform.do", body, auth)
    filename = _xml_val(resp, "BINARY_NAME")
    filepath = _xml_val(resp, "MODEL_PATH")
    filesize = _xml_val(resp, "BINARY_BYTE_SIZE")
    if not filename:
        raise RuntimeError(f"BinaryInform returned no filename:\n{resp[:600]}")
    new_auth = _getauth(new_nonce) if new_nonce else auth
    return {"filename": filename, "path": filepath,
            "size": int(filesize or 0), "auth": new_auth}

def download_ap(model: str, region: str, version: str, outdir: str) -> str:
    info     = get_binary_info(model, region, version)
    fname    = info["filename"]
    fpath    = info["path"]
    filesize = info["size"]
    auth     = info["auth"]
    os.makedirs(outdir, exist_ok=True)
    enc_path = os.path.join(outdir, fname)
    out_path = enc_path.rsplit(".", 1)[0] if fname.endswith((".enc4", ".enc2")) else enc_path

    print(f"Downloading {fname}  ({filesize//1024//1024} MB)...", flush=True)

    body = f'''<?xml version="1.0" encoding="UTF-8"?>
<FUSMsg>
  <FUSHdr><ProDType>Smart Switch</ProDType></FUSHdr>
  <FUSBody><Put>
    <ACCESS_MODE><Data>2</Data></ACCESS_MODE>
    <BINARY_FILE_TYPE><Data>AP</Data></BINARY_FILE_TYPE>
    <BINARY_NATURE><Data>1</Data></BINARY_NATURE>
    <CLIENT_PRODUCT><Data>Smart Switch</Data></CLIENT_PRODUCT>
    <DEVICE_MODEL_BLUETOOTH><Data>{model}</Data></DEVICE_MODEL_BLUETOOTH>
    <DEVICE_LOCAL_CODE><Data>{region}</Data></DEVICE_LOCAL_CODE>
    <DEVICE_FW_VERSION><Data>{version}</Data></DEVICE_FW_VERSION>
    <FILENAME><Data>{fname}</Data></FILENAME>
    <MODEL_PATH><Data>{fpath}</Data></MODEL_PATH>
    <LOGIC_CHECK><Data></Data></LOGIC_CHECK>
  </Put></FUSBody>
</FUSMsg>'''
    _post("/NF_DownloadBinaryInitForMass.do", body, auth)

    dl_url = FUS_HOST + "/NF_DownloadBinaryForMass.do?" + urllib.parse.urlencode({"file": fpath + fname})
    req = urllib.request.Request(dl_url)
    req.add_header("Authorization", auth)
    req.add_header("User-Agent", USER_AGENT)
    chunk = 1 << 20
    downloaded = 0; last_pct = -1
    with urllib.request.urlopen(req, timeout=600) as r, open(enc_path, "wb") as f:
        while True:
            buf = r.read(chunk)
            if not buf: break
            f.write(buf)
            downloaded += len(buf)
            if filesize:
                pct = downloaded * 100 // filesize
                if pct != last_pct and pct % 10 == 0:
                    print(f"  {pct}%  ({downloaded//1024//1024}/{filesize//1024//1024} MB)", flush=True)
                    last_pct = pct
    print(f"Download complete: {enc_path}", flush=True)

    if fname.endswith(".enc4"):
        from Crypto.Cipher import AES
        key = hashlib.md5(version[-16:].encode()).digest() + hashlib.md5(version[:16].encode()).digest()
        iv  = key[:16]
        with open(enc_path, "rb") as f: data = f.read()
        cipher = AES.new(key, AES.MODE_CBC, iv)
        with open(out_path, "wb") as f: f.write(cipher.decrypt(data))
        os.remove(enc_path)
        print(f"Decrypted enc4 → {out_path}", flush=True)
    elif fname.endswith(".enc2"):
        from Crypto.Cipher import AES
        KEY = bytes(range(32))
        with open(enc_path, "rb") as f: data = f.read()
        with open(out_path, "wb") as f: f.write(AES.new(KEY, AES.MODE_ECB).decrypt(data))
        os.remove(enc_path)
        print(f"Decrypted enc2 → {out_path}", flush=True)

    return out_path

if __name__ == "__main__":
    import sys
    cmd = sys.argv[1] if len(sys.argv) > 1 else ""
    if cmd == "latest":
        _, _, model, region = sys.argv
        print(get_latest_version(model, region))
    elif cmd == "download":
        _, _, model, region, version, outdir = sys.argv
        download_ap(model, region, version, outdir)
    else:
        print("Usage: python3 fus.py latest MODEL REGION")
        print("       python3 fus.py download MODEL REGION VERSION OUTDIR")
        sys.exit(1)
PYEOF
          echo "FUS client written to /tmp/fus.py"

      # ── Step 1: Check whether target.h already matches this firmware ──────
      - name: Check firmware version vs current target.h
        id: check
        run: |
          HEADER="src/targets/${TARGET}/target.h"
          if [ ! -f "$HEADER" ]; then
            echo "::error::target.h not found at $HEADER"
            exit 1
          fi
          PINNED=$(grep -oP '(?<=FIRMWARE_VERSION\s")[^"]+' "$HEADER" || echo "")
          echo "Pinned:    ${PINNED:-<none>}"
          echo "Requested: $FW"
          if [ "$PINNED" = "$FW" ]; then
            echo "::notice::target.h already at $FW — nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "SKIP=0" >> "$GITHUB_ENV"
          fi

      # ── Step 2: Download AP firmware via FUS ──────────────────────────────
      - name: Download AP firmware (FUS)
        if: env.SKIP != '1'
        run: |
          mkdir -p fw_dl
          python3 /tmp/fus.py download "$MODEL" "$REGION" "$FW" fw_dl
          echo "=== Downloaded files ==="
          ls -lh fw_dl/

      # ── Step 3: Extract vendor_dlkm.img from the AP tar ───────────────────
      - name: Extract vendor_dlkm.img
        if: env.SKIP != '1'
        run: |
          AP_TAR=$(ls fw_dl/AP_*.tar.md5 fw_dl/AP_*.tar 2>/dev/null | head -1)
          if [ -z "$AP_TAR" ]; then
            echo "::error::No AP tar found in fw_dl/"
            ls fw_dl/
            exit 1
          fi
          echo "AP tar: $AP_TAR"

          ENTRY=$(tar -tf "$AP_TAR" 2>/dev/null | grep vendor_dlkm | head -1)
          if [ -z "$ENTRY" ]; then
            echo "::error::vendor_dlkm not found inside $AP_TAR"
            tar -tf "$AP_TAR" | head -30
            exit 1
          fi
          echo "Extracting: $ENTRY"
          tar -xf "$AP_TAR" "$ENTRY" -C fw_dl/

          BASENAME=$(basename "$ENTRY")
          if echo "$BASENAME" | grep -q '\.lz4$'; then
            lz4 -d "fw_dl/$BASENAME" fw_dl/vendor_dlkm.img
            rm "fw_dl/$BASENAME"
          else
            mv "fw_dl/$BASENAME" fw_dl/vendor_dlkm.img
          fi

          file fw_dl/vendor_dlkm.img
          if file fw_dl/vendor_dlkm.img | grep -qi 'android sparse'; then
            simg2img fw_dl/vendor_dlkm.img fw_dl/vendor_dlkm_raw.img
            mv fw_dl/vendor_dlkm_raw.img fw_dl/vendor_dlkm.img
          fi

          ls -lh fw_dl/vendor_dlkm.img
          rm -f "$AP_TAR"

      # ── Step 4: Mount image and dump symbol offsets ───────────────────────
      - name: Extract kernel module offsets
        if: env.SKIP != '1'
        run: |
          mkdir -p mnt_dlkm
          sudo mount -o loop,ro fw_dl/vendor_dlkm.img mnt_dlkm

          echo "=== All .ko in vendor_dlkm ==="
          find mnt_dlkm -name "*.ko" | sort | tee /tmp/all_kos.txt

          extract_offsets() {
            local KO="$1"
            [ -f "$KO" ] || { echo "::warning::Module not found: $KO"; return; }
            echo "--- $(basename $KO) ---"
            nm --defined-only "$KO" 2>/dev/null \
              | awk '$2~/[TtDdBb]/ {printf "  %-60s 0x%s\n", $3, $1}' \
              | sort
          }

          for MOD in \
            ashmem \
            configfs \
            selinux \
            samsung_q \
            slsi_wlan \
            exynos_chub \
            mfc_core \
            v4l2_mem2mem; do
            KO_PATH=$(find mnt_dlkm -name "${MOD}.ko" | head -1)
            extract_offsets "${KO_PATH}" >> /tmp/module_offsets.txt
          done

          echo "=== Captured offsets ==="
          cat /tmp/module_offsets.txt
          sudo umount mnt_dlkm

      # ── Step 5: Patch target.h ────────────────────────────────────────────
      - name: Update target.h with new offsets
        if: env.SKIP != '1'
        env:
          FIRMWARE_VERSION: ${{ needs.gate.outputs.firmware_version }}
        run: |
          python3 - <<'PYEOF'
          import re, os, sys

          header_path  = f"src/targets/{os.environ['TARGET']}/target.h"
          fw_version   = os.environ['FIRMWARE_VERSION']

          with open(header_path) as f:
              src = f.read()

          offsets = {}
          with open('/tmp/module_offsets.txt') as f:
              for line in f:
                  m = re.match(r'\s+(\S+)\s+(0x[0-9a-f]+)', line)
                  if m:
                      offsets[m.group(1)] = int(m.group(2), 16)

          SYMBOL_MAP = {
              'ASHMEM_IOCTL_OFF':            'ashmem_ioctl',
              'ASHMEM_COMPAT_IOCTL_OFF':     'ashmem_compat_ioctl',
              'ASHMEM_MMAP_OFF':             'ashmem_mmap',
              'ASHMEM_MISC_FOPS_OFF':        'ashmem_misc_fops',
              'CONFIGFS_READ_ITER_OFF':      'configfs_read_iter',
              'CONFIGFS_BIN_WRITE_ITER_OFF': 'configfs_bin_write_iter',
          }

          def patch_define(src, name, val):
              pat  = rf'(#define\s+{re.escape(name)}\s+)(0x[0-9a-fA-F]+|[0-9]+)'
              repl = rf'\g<1>{val:#x}'
              out, n = re.subn(pat, repl, src)
              if n == 0:
                  print(f'  WARNING: #define {name} not found — skipping', file=sys.stderr)
              return out

          changed = []
          for define, sym in SYMBOL_MAP.items():
              if sym in offsets:
                  src = patch_define(src, define, offsets[sym])
                  changed.append(f'{define} = {offsets[sym]:#x}')
              else:
                  print(f'  WARNING: symbol {sym!r} not in module offsets', file=sys.stderr)

          src = re.sub(
              r'(#define\s+FIRMWARE_VERSION\s+")[^"]+"',
              rf'\g<1>{fw_version}"',
              src,
          )

          with open(header_path, 'w') as f:
              f.write(src)

          if changed:
              print('Updated defines:')
              for c in changed: print(f'  {c}')
          else:
              print('No defines updated.')
          PYEOF

          echo "=== Diff ==="
          git diff "src/targets/${TARGET}/target.h" || true

      # ── Step 6: Commit ────────────────────────────────────────────────────
      - name: Commit updated target.h
        if: env.SKIP != '1'
        env:
          FW:     ${{ needs.gate.outputs.firmware_version }}
          TARGET: ${{ needs.gate.outputs.target }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "src/targets/${TARGET}/target.h"
          if git diff --cached --quiet; then
            echo "::notice::target.h unchanged — nothing to commit."
          else
            git commit -m "fix(${TARGET}): update kernel offsets for ${FW}"
            git push origin HEAD:main
          fi

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER — open exploit-rebuild issue to kick off rebuild-artifacts
# ─────────────────────────────────────────────────────────────────────────────
  trigger-rebuild:
    needs: [gate, fetch]
    if: |
      always()
      && needs.fetch.result == 'success'
      && needs.gate.outputs.auto_trigger == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Open exploit-rebuild issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET:   ${{ needs.gate.outputs.target }}
          FW:       ${{ needs.gate.outputs.firmware_version }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "rebuild exploit for ${TARGET} (${FW})" \
            --body "Triggered automatically by fetch-firmware-offsets after committing updated offsets for \`${TARGET}\` at \`${FW}\`." \
            --label "exploit-rebuild"
          echo "Opened exploit-rebuild issue."
