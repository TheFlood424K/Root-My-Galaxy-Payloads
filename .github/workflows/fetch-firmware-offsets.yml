# Fetches the Samsung AP firmware for a target via Samsung NeoFUS (direct HTTP),
# extracts the vendor_dlkm image, mounts it, reads symbol offsets from the
# relevant .ko files, and commits the updated target.h back to main so the
# rebuild-artifacts workflow can consume it.
#
# No third-party Python packages required for the auth/download layer.
# pycryptodome is installed at runtime and used only for .enc4/.enc2 decrypt.
#
# Triggers
#   workflow_dispatch  -- manual run, one target at a time
#   push               -- workflow file change only; fires once to register the
#                         workflow in the Actions UI, then skips all real work
#   issues (closed)    -- firmware-fetch label fires for the default target
#
# Secrets required : none (Samsung FUS is unauthenticated for latest firmware)
# Permissions      : contents:write  issues:write

name: Fetch firmware offsets

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Samsung model number (e.g. SM-S936U1)'
        required: false
        default: 'SM-S936U1'
      region:
        description: 'Region / CSC (e.g. XAA, TMB)'
        required: false
        default: 'XAA'
      firmware_version:
        description: >-
          Full PDA/firmware version string (e.g. S936U1UESCCZF9).
          Leave blank to fetch the latest available version.
        required: false
        default: ''
      target:
        description: >-
          Build-system target name inside src/targets/
          (e.g. pa2q-S936U1UEUCZZHL). Must match the directory
          that contains target.h.
        required: false
        default: 'pa2q-S936U1UEUCZZHL'
      auto_trigger_rebuild:
        description: >-
          Open an exploit-rebuild issue after committing so
          rebuild-artifacts runs automatically.
        required: false
        default: 'true'
  push:
    paths:
      - '.github/workflows/fetch-firmware-offsets.yml'
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write

# ---------------------------------------------------------------------------
# GATE -- decide whether to run and resolve firmware version
# ---------------------------------------------------------------------------
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run:              ${{ steps.decide.outputs.run }}
      model:            ${{ steps.resolve.outputs.model }}
      region:           ${{ steps.resolve.outputs.region }}
      firmware_version: ${{ steps.resolve.outputs.firmware_version }}
      target:           ${{ steps.resolve.outputs.target }}
      auto_trigger:     ${{ steps.resolve.outputs.auto_trigger }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide whether to run
        id: decide
        env:
          EVENT:        ${{ github.event_name }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Push trigger fired (registration only) -- skipping real work."
          else
            HAS=$(echo "$ISSUE_LABELS" \
              | jq -r '[.[].name] | index("firmware-fetch") != null')
            echo "run=$HAS" >> "$GITHUB_OUTPUT"
            [ "$HAS" != "true" ] && echo "No firmware-fetch label -- skipping."
          fi

      - name: Resolve parameters
        id: resolve
        if: steps.decide.outputs.run == 'true'
        env:
          INPUT_MODEL:   ${{ inputs.model }}
          INPUT_REGION:  ${{ inputs.region }}
          INPUT_FW:      ${{ inputs.firmware_version }}
          INPUT_TARGET:  ${{ inputs.target }}
          INPUT_TRIGGER: ${{ inputs.auto_trigger_rebuild }}
          EVENT:         ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "issues" ]; then
            MODEL="SM-S936U1"
            REGION="XAA"
            FW=""
            TARGET="pa2q-S936U1UEUCZZHL"
            TRIGGER="true"
          else
            MODEL="${INPUT_MODEL:-SM-S936U1}"
            REGION="${INPUT_REGION:-XAA}"
            FW="${INPUT_FW:-}"
            TARGET="${INPUT_TARGET:-pa2q-S936U1UEUCZZHL}"
            TRIGGER="${INPUT_TRIGGER:-true}"
          fi

          if [ -z "$FW" ]; then
            echo "No firmware version supplied -- querying FUS for $MODEL / $REGION ..."
            # Capture stdout only; let stderr print to the log for visibility.
            # Validate the result looks like a real PDA version string before
            # accepting it -- this prevents error messages leaking into $FW.
            FW_RAW=$(python3 "$GITHUB_WORKSPACE/scripts/fus.py" \
                       latest "$MODEL" "$REGION" 2>/dev/null || true)
            FW=$(echo "$FW_RAW" | tr -d '[:space:]')
            if ! echo "$FW" | grep -qE '^[A-Za-z0-9]{10,25}$'; then
              echo "::error::FUS version query failed or returned unexpected output."
              echo "::error::Raw output was: ${FW_RAW}"
              echo "::error::Tip: Samsung's NeoFUS endpoint is neofus.samsungmobile.com -- check network access from the runner."
              exit 1
            fi
            echo "Latest firmware version resolved: $FW"
          fi

          echo "model=$MODEL"          >> "$GITHUB_OUTPUT"
          echo "region=$REGION"        >> "$GITHUB_OUTPUT"
          echo "firmware_version=$FW" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"        >> "$GITHUB_OUTPUT"
          echo "auto_trigger=$TRIGGER" >> "$GITHUB_OUTPUT"

# ---------------------------------------------------------------------------
# FETCH -- download AP, extract modules, derive offsets, update target.h
# ---------------------------------------------------------------------------
  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      MODEL:  ${{ needs.gate.outputs.model }}
      REGION: ${{ needs.gate.outputs.region }}
      FW:     ${{ needs.gate.outputs.firmware_version }}
      TARGET: ${{ needs.gate.outputs.target }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lz4 android-sdk-libsparse-utils python3-pip jq
          pip install --quiet pycryptodome || true

      # fus.py lives in scripts/ -- no heredoc needed
      - name: Stage FUS client
        run: cp "$GITHUB_WORKSPACE/scripts/fus.py" /tmp/fus.py

      # -- Step 1: Check whether target.h already matches this firmware -----
      - name: Check firmware version vs current target.h
        id: check
        run: |
          HEADER="src/targets/${TARGET}/target.h"
          if [ ! -f "$HEADER" ]; then
            echo "::error::target.h not found at $HEADER"
            exit 1
          fi
          PINNED=$(grep -oP '(?<=FIRMWARE_VERSION\s")[^"]+' "$HEADER" || echo "")
          echo "Pinned:    ${PINNED:-<none>}"
          echo "Requested: $FW"
          if [ "$PINNED" = "$FW" ]; then
            echo "::notice::target.h already at $FW -- nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "SKIP=0" >> "$GITHUB_ENV"
          fi

      # -- Step 2: Download AP firmware via FUS -----------------------------
      - name: Download AP firmware (FUS)
        if: env.SKIP != '1'
        run: |
          mkdir -p fw_dl
          python3 /tmp/fus.py download "$MODEL" "$REGION" "$FW" fw_dl
          echo "=== Downloaded files ==="
          ls -lh fw_dl/

      # -- Step 3: Extract vendor_dlkm.img from the AP tar ------------------
      - name: Extract vendor_dlkm.img
        if: env.SKIP != '1'
        run: |
          AP_TAR=$(ls fw_dl/AP_*.tar.md5 fw_dl/AP_*.tar 2>/dev/null | head -1)
          if [ -z "$AP_TAR" ]; then
            echo "::error::No AP tar found in fw_dl/"
            ls fw_dl/
            exit 1
          fi
          echo "AP tar: $AP_TAR"

          ENTRY=$(tar -tf "$AP_TAR" 2>/dev/null | grep vendor_dlkm | head -1)
          if [ -z "$ENTRY" ]; then
            echo "::error::vendor_dlkm not found inside $AP_TAR"
            tar -tf "$AP_TAR" | head -30
            exit 1
          fi
          echo "Extracting: $ENTRY"
          tar -xf "$AP_TAR" "$ENTRY" -C fw_dl/

          BASENAME=$(basename "$ENTRY")
          if echo "$BASENAME" | grep -q '\.lz4$'; then
            lz4 -d "fw_dl/$BASENAME" fw_dl/vendor_dlkm.img
            rm "fw_dl/$BASENAME"
          else
            mv "fw_dl/$BASENAME" fw_dl/vendor_dlkm.img
          fi

          file fw_dl/vendor_dlkm.img
          if file fw_dl/vendor_dlkm.img | grep -qi 'android sparse'; then
            simg2img fw_dl/vendor_dlkm.img fw_dl/vendor_dlkm_raw.img
            mv fw_dl/vendor_dlkm_raw.img fw_dl/vendor_dlkm.img
          fi

          ls -lh fw_dl/vendor_dlkm.img
          rm -f "$AP_TAR"

      # -- Step 4: Mount image and dump symbol offsets ----------------------
      - name: Extract kernel module offsets
        if: env.SKIP != '1'
        run: |
          mkdir -p mnt_dlkm
          sudo mount -o loop,ro fw_dl/vendor_dlkm.img mnt_dlkm

          echo "=== All .ko in vendor_dlkm ==="
          find mnt_dlkm -name "*.ko" | sort | tee /tmp/all_kos.txt

          extract_offsets() {
            local KO="$1"
            [ -f "$KO" ] || { echo "::warning::Module not found: $KO"; return; }
            echo "--- $(basename "$KO") ---"
            nm --defined-only "$KO" 2>/dev/null \
              | awk '$2~/[TtDdBb]/ {printf "  %-60s 0x%s\n", $3, $1}' \
              | sort
          }

          for MOD in \
            ashmem configfs selinux samsung_q \
            slsi_wlan exynos_chub mfc_core v4l2_mem2mem; do
            KO_PATH=$(find mnt_dlkm -name "${MOD}.ko" | head -1)
            extract_offsets "${KO_PATH}" >> /tmp/module_offsets.txt
          done

          echo "=== Captured offsets ==="
          cat /tmp/module_offsets.txt
          sudo umount mnt_dlkm

      # -- Step 5: Patch target.h -------------------------------------------
      - name: Update target.h with new offsets
        if: env.SKIP != '1'
        env:
          FIRMWARE_VERSION: ${{ needs.gate.outputs.firmware_version }}
        run: |
          python3 - <<'PYEOF'
          import re, os, sys

          header_path = "src/targets/{}/target.h".format(os.environ["TARGET"])
          fw_version  = os.environ["FIRMWARE_VERSION"]

          with open(header_path) as f:
              src = f.read()

          offsets = {}
          with open("/tmp/module_offsets.txt") as f:
              for line in f:
                  m = re.match(r"\s+(\S+)\s+(0x[0-9a-f]+)", line)
                  if m:
                      offsets[m.group(1)] = int(m.group(2), 16)

          SYMBOL_MAP = {
              "ASHMEM_IOCTL_OFF":            "ashmem_ioctl",
              "ASHMEM_COMPAT_IOCTL_OFF":     "ashmem_compat_ioctl",
              "ASHMEM_MMAP_OFF":             "ashmem_mmap",
              "ASHMEM_MISC_FOPS_OFF":        "ashmem_misc_fops",
              "CONFIGFS_READ_ITER_OFF":      "configfs_read_iter",
              "CONFIGFS_BIN_WRITE_ITER_OFF": "configfs_bin_write_iter",
          }

          def patch_define(src, name, val):
              pat  = r"(#define\s+{}\s+)(0x[0-9a-fA-F]+|[0-9]+)".format(
                  re.escape(name))
              repl = r"\g<1>{:#x}".format(val)
              out, n = re.subn(pat, repl, src)
              if n == 0:
                  print("  WARNING: #define {} not found".format(name),
                        file=sys.stderr)
              return out

          changed = []
          for define, sym in SYMBOL_MAP.items():
              if sym in offsets:
                  src = patch_define(src, define, offsets[sym])
                  changed.append("{} = {:#x}".format(define, offsets[sym]))
              else:
                  print("  WARNING: symbol {!r} not found".format(sym),
                        file=sys.stderr)

          src = re.sub(
              r'(#define\s+FIRMWARE_VERSION\s+")[^"]+"',
              r'\g<1>' + fw_version + '"',
              src,
          )

          with open(header_path, "w") as f:
              f.write(src)

          if changed:
              print("Updated defines:")
              for c in changed:
                  print("  " + c)
          else:
              print("No defines updated.")
          PYEOF

          echo "=== Diff ==="
          git diff "src/targets/${TARGET}/target.h" || true

      # -- Step 6: Commit ---------------------------------------------------
      - name: Commit updated target.h
        if: env.SKIP != '1'
        env:
          FW:     ${{ needs.gate.outputs.firmware_version }}
          TARGET: ${{ needs.gate.outputs.target }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "src/targets/${TARGET}/target.h"
          if git diff --cached --quiet; then
            echo "::notice::target.h unchanged -- nothing to commit."
          else
            git commit -m "fix(${TARGET}): update kernel offsets for ${FW}"
            git push origin HEAD:main
          fi

# ---------------------------------------------------------------------------
# TRIGGER -- open exploit-rebuild issue to kick off rebuild-artifacts
# ---------------------------------------------------------------------------
  trigger-rebuild:
    needs: [gate, fetch]
    if: |
      always()
      && needs.fetch.result == 'success'
      && needs.gate.outputs.auto_trigger == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Open exploit-rebuild issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET:   ${{ needs.gate.outputs.target }}
          FW:       ${{ needs.gate.outputs.firmware_version }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "rebuild exploit for ${TARGET} (${FW})" \
            --body "Auto-triggered by fetch-firmware-offsets after committing updated offsets for \`${TARGET}\` at \`${FW}\`." \
            --label "exploit-rebuild"
          echo "Opened exploit-rebuild issue."
