# Builds the perf_phys oracle exploit .so for SM-S938N (pa3q firmware
# S938NKSUACZF1) and commits it to artifacts/pa3q-S938NKSUACZF1-perf/.
#
# Triggers:
#   - issues: fires when issue #6 (artifact tracking issue) is closed
#   - workflow_dispatch: manual run at any time
#
# Why a dedicated workflow: the build host must be linux-x86_64 so that the
# Android NDK clang binary is executable.  Building locally from an aarch64
# WSL environment fails with "Exec format error" because Google does not ship
# an aarch64 Linux NDK host package.

name: Build pa3q perf_phys oracle artifact

on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check trigger
        id: gate
        env:
          EVENT:        ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — proceeding."
            exit 0
          fi
          # issues event: only fire for issue #6
          if [ "$ISSUE_NUMBER" = "6" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Issue #6 closed — proceeding."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Issue #${ISSUE_NUMBER} closed — not our trigger, skipping."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: true

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-ndk.outputs.ndk-path }}
          key: ndk-r29

      - name: Fix NDK clang symlink (r27+)
        run: |
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          VERSIONED=$(ls "${NDK_BIN}/clang-"[0-9]* 2>/dev/null | head -1)
          if [ -n "${VERSIONED}" ]; then
            ln -sf "${VERSIONED}" "${NDK_BIN}/clang"
            echo "Symlink: clang -> $(basename ${VERSIONED})"
          else
            echo "::error::No versioned clang found in NDK bin"
            exit 1
          fi
          if [ ! -f "${NDK_BIN}/ld.lld" ]; then
            if [ -f "${NDK_BIN}/lld" ]; then
              ln -sf "${NDK_BIN}/lld" "${NDK_BIN}/ld.lld"
              echo "Symlink: ld.lld -> lld"
            else
              echo "::error::No lld found in NDK bin"
              exit 1
            fi
          fi

      - name: Create pa3q target symlink if needed
        run: |
          # The Makefile expects src/targets/pa3q/target.h but the source tree
          # uses firmware-versioned directories.  Create a symlink if the generic
          # name does not already exist.
          if [ ! -d src/targets/pa3q ]; then
            cp -r src/targets/pa3q-S938NKSUACZF1 src/targets/pa3q
            echo "Created src/targets/pa3q from pa3q-S938NKSUACZF1"
          else
            echo "src/targets/pa3q already exists"
          fi

      - name: Build exploit .so
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          make ORACLE=perf_phys TARGET=pa3q FIRMWARE=S938NKSUACZF1
          echo "Build output:"
          ls -la build/pa3q/

      - name: Verify artifact size
        run: |
          EXPECTED=$(python3 - <<'PYEOF'
          import json
          with open('support/targets-v3.json') as f:
              data = json.load(f)
          for p in data['payloads']:
              if p.get('payloadId') == 'pa3q-S938NKSUACZF1-perf':
                  print(p['exploit']['size'])
                  break
          PYEOF
          )
          ACTUAL=$(stat -c %s build/pa3q/cve-2026-43499-app.so)
          echo "Expected (from targets-v3.json): ${EXPECTED} bytes"
          echo "Actual:                          ${ACTUAL} bytes"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::warning::Artifact size ${ACTUAL} does not match targets-v3.json size ${EXPECTED} — update exploit.size if intentional."
          else
            echo "Size matches targets-v3.json. Good."
          fi

      - name: Stage artifact
        run: |
          mkdir -p artifacts/pa3q-S938NKSUACZF1-perf
          cp build/pa3q/cve-2026-43499-app.so \
             artifacts/pa3q-S938NKSUACZF1-perf/cve-2026-43499-app.so
          echo "Staged to artifacts/pa3q-S938NKSUACZF1-perf/cve-2026-43499-app.so"

      - name: Update exploit size in targets-v3.json
        run: |
          ACTUAL=$(stat -c %s artifacts/pa3q-S938NKSUACZF1-perf/cve-2026-43499-app.so)
          python3 - <<PYEOF
          import json
          with open('support/targets-v3.json') as f:
              data = json.load(f)
          for p in data['payloads']:
              if p.get('payloadId') == 'pa3q-S938NKSUACZF1-perf':
                  p['exploit']['size'] = ${ACTUAL}
                  break
          with open('support/targets-v3.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          print(f"Updated exploit.size to ${ACTUAL}")
          PYEOF

      - name: Commit and push artifact
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/pa3q-S938NKSUACZF1-perf/cve-2026-43499-app.so \
                  support/targets-v3.json
          if git diff --cached --quiet; then
            echo "Artifact already up to date — nothing to commit."
          else
            git commit -m "artifact: add pa3q-S938NKSUACZF1-perf perf_phys oracle build (closes #6)"
            git push
          fi

      - name: Upload artifact (workflow run archive)
        uses: actions/upload-artifact@v4
        with:
          name: pa3q-S938NKSUACZF1-perf-exploit
          path: artifacts/pa3q-S938NKSUACZF1-perf/cve-2026-43499-app.so
          retention-days: 30
