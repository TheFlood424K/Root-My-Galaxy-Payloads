# Polls tiann/KernelSU daily for a new release.
# If a newer tag is found AND no open rebase-needed issue exists,
# opens a new issue asking for a rebased patch and stops.
# The rebuild workflow only runs after that issue is closed.

name: Check for new KernelSU release

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_issue:
        description: 'Open an issue even if tag matches current (for testing)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve latest upstream KernelSU tag
        id: upstream
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/tiann/KernelSU/releases/latest \
                | jq -r '.tag_name')
          TYPE=$(curl -fsSL "https://api.github.com/repos/tiann/KernelSU/git/refs/tags/${TAG}" \
                 | jq -r '.object.type')
          SHA=$(curl -fsSL "https://api.github.com/repos/tiann/KernelSU/git/refs/tags/${TAG}" \
                | jq -r '.object.sha')
          if [ "$TYPE" = "tag" ]; then
            SHA=$(curl -fsSL "https://api.github.com/repos/tiann/KernelSU/git/tags/${SHA}" \
                  | jq -r '.object.sha')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream: $TAG @ $SHA"

      - name: Read currently-pinned tag
        id: pinned
        run: |
          CURRENT=$(grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' kernelsu/README.md | head -1 || echo "none")
          echo "tag=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Pinned: $CURRENT"

      - name: Check for existing open rebase issue
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "kernelsu-rebase" \
            --json number \
            --jq 'length')
          echo "open_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Open rebase issues: $COUNT"

      - name: Open rebase issue
        if: |
          (steps.upstream.outputs.tag != steps.pinned.outputs.tag || inputs.force_issue == 'true')
          && steps.existing.outputs.open_count == '0'
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG:     ${{ steps.upstream.outputs.tag }}
          NEW_SHA:     ${{ steps.upstream.outputs.sha }}
          CURRENT_TAG: ${{ steps.pinned.outputs.tag }}
        run: |
          BODY=$(cat <<'ISSUEEOF'
          ## KernelSU ${NEW_TAG} requires a rebased Samsung patch

          The upstream [tiann/KernelSU](https://github.com/tiann/KernelSU) has published **${NEW_TAG}** (`${NEW_SHA}`).
          The binaries in this repo are currently built from **${CURRENT_TAG}**.

          The Samsung KDP/RKP/DEFEX patch in `kernelsu/patches/` must be manually rebased onto ${NEW_TAG} before the build workflow can run.

          ---

          ## Prerequisites

          Install the following before starting. Each installer linked below has a **Next → Next → Finish** default install that works fine.

          | Tool | Download | Notes |
          |------|----------|---------|
          | **Git for Windows** | https://git-scm.com/download/win | During setup, choose *"Use Git from the command line and also from 3rd-party software"* |
          | **GitHub CLI** | https://cli.github.com | Used to push your patch and clone the payloads repo |

          After installing, open a new **PowerShell** window (Win + X → "Windows PowerShell" or "Terminal") and verify:

          ```powershell
          git --version
          gh --version
          ```

          Then authenticate GitHub CLI (one-time):

          ```powershell
          gh auth login
          # Choose: GitHub.com → HTTPS → Login with a web browser → follow prompts
          ```

          ---

          ## Steps

          ### 1 — Clone both repositories

          ```powershell
          # Pick a working folder (e.g. your Desktop or Documents)
          cd "$env:USERPROFILE\Desktop"

          # Clone the upstream KernelSU source
          git clone https://github.com/tiann/KernelSU.git

          # Clone the payloads repo
          gh repo clone TheFlood424K/Root-My-Galaxy-Payloads
          ```

          ### 2 — Find the current patch file

          ```powershell
          Get-ChildItem "Root-My-Galaxy-Payloads\kernelsu\patches\*samsung-kdp-rkp-defex.patch"
          ```

          Note the filename — you'll need it in the next step. It will look like:
          `KernelSU-${CURRENT_TAG}-samsung-kdp-rkp-defex.patch`

          ### 3 — Recreate the patched branch at the old base

          ```powershell
          cd KernelSU

          git checkout ${CURRENT_TAG}
          git switch -c samsung-kdp-rebase

          # Apply the existing patch using --3way so Git can fall back to a merge
          # when context lines have shifted between versions
          git apply --3way "..\Root-My-Galaxy-Payloads\kernelsu\patches\KernelSU-${CURRENT_TAG}-samsung-kdp-rkp-defex.patch"

          git add -A
          git commit -m "Samsung KDP/RKP/DEFEX integration (${CURRENT_TAG})"
          ```

          > **Why `--3way`?** Without it, `git apply` rejects the patch the moment any context line doesn't match exactly. The `--3way` flag falls back to a three-way merge for hunks whose context has drifted, giving you a conflict to resolve rather than an outright failure.

          ### 4 — Rebase onto the new tag

          ```powershell
          git rebase ${NEW_TAG}
          ```

          > **If you see conflicts:** Git will pause and list the conflicting files.
          > Open each file in a text editor, find the `<<<<<<<` / `=======` / `>>>>>>>` markers, resolve them manually, then run:
          > ```powershell
          > git add <resolved-file>
          > git rebase --continue
          > ```
          > Repeat until the rebase completes. If you get stuck, `git rebase --abort` resets everything.

          ### 5 — Verify the patch is not empty

          Before exporting, confirm the rebase actually produced changes:

          ```powershell
          # Should show a non-zero diff stat — if it's blank, something went wrong above
          git diff ${NEW_TAG} HEAD --stat
          ```

          ### 6 — Export the new patch

          ```powershell
          # Still inside the KernelSU folder
          git diff ${NEW_TAG} HEAD > "..\Root-My-Galaxy-Payloads\kernelsu\patches\KernelSU-${NEW_TAG}-samsung-kdp-rkp-defex.patch"
          ```

          Verify the file has real content:

          ```powershell
          Get-Item "..\Root-My-Galaxy-Payloads\kernelsu\patches\KernelSU-${NEW_TAG}-samsung-kdp-rkp-defex.patch" | Select-Object Length
          # Expect tens of KB — if it shows 0, the diff was empty (go back to step 3)
          ```

          Then do a dry-run apply to confirm CI will accept it:

          ```powershell
          git apply --check "..\Root-My-Galaxy-Payloads\kernelsu\patches\KernelSU-${NEW_TAG}-samsung-kdp-rkp-defex.patch"
          # Should exit silently with no errors
          ```

          ### 7 — Commit and push the patch

          ```powershell
          cd "..\Root-My-Galaxy-Payloads"

          git add "kernelsu\patches\KernelSU-${NEW_TAG}-samsung-kdp-rkp-defex.patch"
          git commit -m "patch: rebase Samsung KDP/RKP/DEFEX onto KernelSU ${NEW_TAG}"
          git push
          ```

          ### 8 — Test, then close this issue

          > **Do not close this issue until the rebased patch has been tested** against at least one representative target per KMI family (android12-5.10, android13-5.15, android14-6.1, android15-6.6).

          Once testing passes, close this issue — that automatically triggers the rebuild workflow.
          ISSUEEOF
          )

          # Substitute shell variables into the heredoc body
          BODY=$(echo "$BODY" \
            | sed "s|\${NEW_TAG}|${NEW_TAG}|g" \
            | sed "s|\${NEW_SHA}|${NEW_SHA}|g" \
            | sed "s|\${CURRENT_TAG}|${CURRENT_TAG}|g")

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rebase Samsung patch onto KernelSU ${NEW_TAG}" \
            --body "$BODY" \
            --label "kernelsu-rebase"

      - name: Log skip reason
        if: steps.existing.outputs.open_count != '0'
        run: |
          echo "A rebase issue is already open — skipping duplicate."

      - name: Already current
        if: |
          steps.upstream.outputs.tag == steps.pinned.outputs.tag
          && inputs.force_issue != 'true'
        run: |
          echo "Already at ${{ steps.pinned.outputs.tag }}, nothing to do."
