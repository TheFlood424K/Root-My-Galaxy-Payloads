# Rebuilds all ksud/* late-load binaries and commits them back to main.
#
# Triggers:
#   - issues: runs when an issue labelled 'kernelsu-rebase' is closed
#   - workflow_dispatch: manual run (supply ksu_tag or leave blank for latest)
#
# The check-ksu-release workflow is the gate; this workflow does not poll.

name: Rebuild KernelSU binaries

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: 'KernelSU tag to build (leave empty for latest release)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if already at this tag'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: read

jobs:
  # ── Gate: only proceed when triggered by a closing rebase issue ────────────
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed:     ${{ steps.gate.outputs.proceed }}
      ksu_tag:     ${{ steps.resolve.outputs.ksu_tag }}
      ksu_commit:  ${{ steps.resolve.outputs.ksu_commit }}
      current_tag: ${{ steps.pinned.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Evaluate trigger
        id: gate
        env:
          EVENT:        ${{ github.event_name }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Triggered manually — proceeding."
            exit 0
          fi

          # issues event: only care about the kernelsu-rebase label
          HAS_LABEL=$(echo "$ISSUE_LABELS" | jq -r '[.[].name] | index("kernelsu-rebase") != null')
          if [ "$HAS_LABEL" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Issue closed but not labelled kernelsu-rebase — skipping."
            exit 0
          fi

          # Guard: abort if another rebase issue is still open
          OPEN=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "kernelsu-rebase" \
            --json number \
            --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "$OPEN open rebase issue(s) still exist — skipping rebuild."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "Rebase issue closed and no others open — proceeding."

      - name: Resolve target KernelSU tag
        id: resolve
        if: steps.gate.outputs.proceed == 'true'
        env:
          INPUT_TAG: ${{ inputs.ksu_tag }}
        run: |
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL https://api.github.com/repos/tiann/KernelSU/releases/latest \
                  | jq -r '.tag_name')
          fi
          TYPE=$(curl -fsSL "https://api.github.com/repos/tiann/KernelSU/git/refs/tags/${TAG}" \
                 | jq -r '.object.type')
          SHA=$(curl -fsSL "https://api.github.com/repos/tiann/KernelSU/git/refs/tags/${TAG}" \
                | jq -r '.object.sha')
          if [ "$TYPE" = "tag" ]; then
            SHA=$(curl -fsSL "https://api.github.com/repos/tiann/KernelSU/git/tags/${SHA}" \
                  | jq -r '.object.sha')
          fi
          echo "ksu_tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "ksu_commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building: $TAG @ $SHA"

      - name: Read pinned tag
        id: pinned
        if: steps.gate.outputs.proceed == 'true'
        run: |
          CURRENT=$(grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' kernelsu/README.md | head -1 || echo "none")
          echo "tag=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Skip if already current (non-forced dispatch)
        if: |
          steps.gate.outputs.proceed == 'true'
          && steps.resolve.outputs.ksu_tag == steps.pinned.outputs.tag
          && inputs.force != 'true'
          && github.event_name == 'workflow_dispatch'
        run: |
          echo "Already at ${{ steps.resolve.outputs.ksu_tag }} — set force=true to override."
          echo "proceed=false" >> "$GITHUB_OUTPUT"

  # ── Build matrix ───────────────────────────────────────────────────────────
  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: s25u-kdp
            kmi: android15-6.6
            ddk_image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
            kernel_release: 6.6.98-android15-8
            cargo_target: aarch64-linux-android35
          - target: A566EXXSCCZG6-kdp
            kmi: android15-6.6
            ddk_image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
            kernel_release: 6.6.102-android15-8
            cargo_target: aarch64-linux-android35
          - target: A366WVLS3AYG1-kdp
            kmi: android15-6.6
            ddk_image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
            kernel_release: 6.6.46-android15-8
            cargo_target: aarch64-linux-android35
          - target: e3q-S928USQS6DZF2-kdp
            kmi: android14-6.1
            ddk_image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
            kernel_release: 6.1.145-android14-11-33419968-abS928USQS6DZF2
            cargo_target: aarch64-linux-android35
          - target: e3q-S928BXXS6DZF2-kdp
            kmi: android14-6.1
            ddk_image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
            kernel_release: 6.1.145-android14-11
            cargo_target: aarch64-linux-android35
          - target: e2s-S926BXXUEDZDR-kdp
            kmi: android14-6.1
            ddk_image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
            kernel_release: 6.1.157-android14-11
            cargo_target: aarch64-linux-android35
          - target: e1s-S921BXXSFDZE1-kdp
            kmi: android14-6.1
            ddk_image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
            kernel_release: 6.1.157-android14-11
            cargo_target: aarch64-linux-android35
          - target: e1s-S921NKSSFDZF3-kdp
            kmi: android14-6.1
            ddk_image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
            kernel_release: 6.1.157-android14-11
            cargo_target: aarch64-linux-android35
          - target: dm3q-S9180ZHS8FZF5-kdp
            kmi: android13-5.15
            ddk_image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
            kernel_release: 5.15.189-android13-8
            cargo_target: aarch64-linux-android33
          - target: dm3q-S918BXXSAFZF5-kdp
            kmi: android13-5.15
            ddk_image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
            kernel_release: 5.15.189-android13-8
            cargo_target: aarch64-linux-android33
          - target: dm1q-S911U1UES6DYI3-kdp
            kmi: android13-5.15
            ddk_image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
            kernel_release: 5.15.153-android13-8
            cargo_target: aarch64-linux-android33
          - target: A536EXXSNGZG3-kdp
            kmi: android12-5.10
            ddk_image: ghcr.io/ylarod/ddk-min:android12-5.10-20260313
            kernel_release: 5.10.237-android12-9
            cargo_target: aarch64-linux-android31

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true

      - name: Checkout latest KernelSU at target tag
        uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: ${{ needs.gate.outputs.ksu_tag }}
          path: KernelSU
          submodules: recursive
          fetch-depth: 1

      - name: Patch KernelSU ksud API mismatch (idempotent)
        shell: bash
        run: |
          set -euo pipefail

          CLI_RS="KernelSU/userspace/ksud/src/cli.rs"
          UTILS_RS="KernelSU/userspace/ksud/src/utils.rs"

          # Fix call site — safe to run even if already patched.
          if grep -q 'utils::install(libadbroot, data_path)' "$CLI_RS" 2>/dev/null; then
            sed -i 's/utils::install(libadbroot, data_path)/utils::install(libadbroot)/' "$CLI_RS"
            echo "cli.rs: removed data_path argument from install() call."
          else
            echo "cli.rs: call site already clean — skipping."
          fi

          # Rename unused parameter — safe to run even if already renamed.
          if grep -q 'data_path: Option<PathBuf>' "$UTILS_RS" 2>/dev/null; then
            sed -i \
              's/staged_exe: impl AsRef<Path>, data_path: Option<PathBuf>/staged_exe: impl AsRef<Path>, _data_path: Option<PathBuf>/' \
              "$UTILS_RS"
            echo "utils.rs: renamed data_path to _data_path."
          else
            echo "utils.rs: parameter already renamed or absent — skipping."
          fi

          # Remove obsolete KSU_DATA_PATH env var assignment — safe if already gone.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("KernelSU/userspace/ksud/src/utils.rs")
          text = path.read_text()

          needle = 'std::env::set_var("KSU_DATA_PATH", data_path);'
          if needle in text:
              text = text.replace(needle, "// removed obsolete KSU_DATA_PATH assignment", 1)
              path.write_text(text)
              print("utils.rs: removed obsolete KSU_DATA_PATH assignment.")
          else:
              print("utils.rs: KSU_DATA_PATH assignment already absent — skipping.")
          PY

          git -C KernelSU diff -- \
            userspace/ksud/src/cli.rs \
            userspace/ksud/src/utils.rs

      - name: Apply Samsung patch
        run: |
          PATCH="kernelsu/patches/KernelSU-${{ needs.gate.outputs.ksu_tag }}-samsung-kdp-rkp-defex.patch"
      
          if [ ! -f "$PATCH" ]; then
            echo "::error::No Samsung patch exists for KernelSU ${{ needs.gate.outputs.ksu_tag }}."
            echo "::error::Add or rebase kernelsu/patches/KernelSU-${{ needs.gate.outputs.ksu_tag }}-samsung-kdp-rkp-defex.patch first."
            exit 1
          fi
      
          echo "Applying $PATCH"
          cd KernelSU
      
          git apply --check "../$PATCH" || {
            echo "::error::Patch does not apply cleanly to ${{ needs.gate.outputs.ksu_tag }}."
            exit 1
          }
      
          git apply "../$PATCH"

      - name: Build .ko inside DDK container
        env:
          KMI:            ${{ matrix.kmi }}
          KERNEL_RELEASE: ${{ matrix.kernel_release }}
          DDK_IMAGE:      ${{ matrix.ddk_image }}
        run: |
          mkdir -p out
          docker run --rm \
            -e KERNEL_RELEASE="${KERNEL_RELEASE}" \
            -v "$PWD/KernelSU:/workspace" \
            -w /workspace \
            "$DDK_IMAGE" \
            bash -lc '
              set -euo pipefail
              find "$KDIR/include/generated" "$KDIR/include/config" \
                \( -name "utsrelease.h" -o -name "kernel.release" \) 2>/dev/null \
                | xargs -r sed -i "s|[0-9][^ \"]*dirty|${KERNEL_RELEASE}|g"
              make -C "$KDIR" M="$PWD/kernel" src="$PWD/kernel" \
                ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                CONFIG_KSU=m \
                CONFIG_KSU_SAMSUNG_KDP=y \
                CONFIG_KSU_SAMSUNG_RKP=y \
                CONFIG_KSU_SAMSUNG_DEFEX=y \
                KBUILD_MODPOST_WARN=1 modules
              modinfo kernel/kernelsu.ko
              llvm-strip -d kernel/kernelsu.ko
            '
          cp KernelSU/kernel/kernelsu.ko "out/${KMI}_kernelsu-${{ matrix.target }}.ko"

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev

      - name: Build ksud
        env:
          KMI:          ${{ matrix.kmi }}
          CARGO_TARGET: ${{ matrix.cargo_target }}
          ANDROID_NDK:  ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="${NDK_BIN}:${PATH}"
          export LIBCLANG_PATH="$(llvm-config --libdir)"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_BIN}/${CARGO_TARGET}-clang"
          export CC_aarch64_linux_android="${NDK_BIN}/${CARGO_TARGET}-clang"
          export AR_aarch64_linux_android="${NDK_BIN}/llvm-ar"
          cp "out/${KMI}_kernelsu-${{ matrix.target }}.ko" \
             "KernelSU/userspace/ksud/bin/aarch64/${KMI}_kernelsu.ko"
          cd KernelSU/userspace/ksud
          cargo build --release --target aarch64-linux-android -p ksud
          cp target/aarch64-linux-android/release/ksud \
             "../../../out/ksud-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksud-${{ matrix.target }}
          path: |
            out/ksud-${{ matrix.target }}
            out/${{ matrix.kmi }}_kernelsu-${{ matrix.target }}.ko
          retention-days: 7

  # ── Commit rebuilt artifacts back to main ─────────────────────────────────
  commit:
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-dl
          merge-multiple: true

      - name: Install files and update metadata
        env:
          KSU_TAG:    ${{ needs.gate.outputs.ksu_tag }}
          KSU_COMMIT: ${{ needs.gate.outputs.ksu_commit }}
        run: |
          set -euo pipefail

          for f in artifacts-dl/ksud-*; do
            name=$(basename "$f")
            cp "$f" "kernelsu/${name}"
            echo "  kernelsu/${name}: $(stat -c %s kernelsu/${name}) bytes"
          done
          for f in artifacts-dl/*.ko; do
            name=$(basename "$f")
            cp "$f" "kernelsu/${name}"
            echo "  kernelsu/${name}: $(stat -c %s kernelsu/${name}) bytes"
          done

          # Update pinned-version line in README
          sed -i \
            "s|KernelSU \`v[0-9]\+\.[0-9]\+\.[0-9]\+\`, commit|KernelSU \`${KSU_TAG}\`, commit|" \
            kernelsu/README.md
          sed -i \
            "s|\`[0-9a-f]\{40\}\`|\`${KSU_COMMIT}\`|" \
            kernelsu/README.md

          python3 - <<'PYEOF'
          import json, os, re, urllib.request

          with open("support/targets-v3.json") as f:
              data = json.load(f)

          for payload in data["payloads"]:
              ksu = payload.get("kernelsu", {})
              fname = ksu.get("url", "").split("/")[-1]
              local = os.path.join("kernelsu", fname)
              if os.path.isfile(local):
                  ksu["size"] = os.path.getsize(local)

          meta = json.loads(urllib.request.urlopen(
              "https://api.github.com/repos/tiann/KernelSU/releases/latest"
          ).read())
          apk = next((a for a in meta["assets"] if a["name"].endswith("-release.apk")), None)
          if apk:
              vc = re.search(r'_(\d+)-release', apk["name"])
              data["kernelsuManager"] = {
                  "version":             meta["tag_name"],
                  "versionCode":         int(vc.group(1)) if vc else 0,
                  "latestReleaseApiUrl": "https://api.github.com/repos/tiann/KernelSU/releases/latest",
                  "apkUrl":              apk["browser_download_url"],
              }

          with open("support/targets-v3.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PYEOF

      - name: Commit and push
        env:
          KSU_TAG: ${{ needs.gate.outputs.ksu_tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kernelsu/ support/targets-v3.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: rebuild KernelSU binaries for ${KSU_TAG}"
            git push
          fi
