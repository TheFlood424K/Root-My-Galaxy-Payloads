# Rebuilds all ksud/* late-load binaries and commits them back to main.
#
# Triggers:
#   - issues: runs when an issue labelled 'kernelsu-rebase' is closed
#   - workflow_dispatch: manual run (supply ksu_tag or leave blank for latest)
#
# The check-ksu-release workflow is the gate; this workflow does not poll.

name: Rebuild KernelSU binaries

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: 'KernelSU tag to build (leave empty for latest release)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if already at this tag'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: read

jobs:
  # ── Gate: only proceed when triggered by a closing rebase issue ────────────
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed:     ${{ steps.gate.outputs.proceed }}
      ksu_tag:     ${{ steps.resolve.outputs.ksu_tag }}
      ksu_commit:  ${{ steps.resolve.outputs.ksu_commit }}
      current_tag: ${{ steps.pinned.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Evaluate trigger
        id: gate
        env:
          EVENT:        ${{ github.event_name }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Triggered manually — proceeding."
            exit 0
          fi

          # issues event: only care about the kernelsu-rebase label
          HAS_LABEL=$(echo "$ISSUE_LABELS" | jq -r '[.[].name] | index("kernelsu-rebase") != null')
          if [ "$HAS_LABEL" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Issue closed but not labelled kernelsu-rebase — skipping."
            exit 0
          fi

          # Guard: abort if another rebase issue is still open
          OPEN=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "kernelsu-rebase" \
            --json number \
            --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "$OPEN open rebase issue(s) still exist — skipping rebuild."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "Rebase issue closed and no others open — proceeding."

      - name: Resolve target KernelSU tag
        id: resolve
        if: steps.gate.outputs.proceed == 'true'
        env:
          INPUT_TAG: ${{ inputs.ksu_tag }}
        run: |
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL https://api.github.com/repos/tiann/KernelSU/releases/latest \
                  | jq -r '.tag_name')
          fi
          TYPE=$(curl -fsSL "https://api.github.com/repos/tiann/KernelSU/git/refs/tags/${TAG}" \
                 | jq -r '.object.type')
          SHA=$(curl -fsSL "https://api.github.com/repos/tiann/KernelSU/git/refs/tags/${TAG}" \
                | jq -r '.object.sha')
          if [ "$TYPE" = "tag" ]; then
            SHA=$(curl -fsSL "https://api.github.com/repos/tiann/KernelSU/git/tags/${SHA}" \
                  | jq -r '.object.sha')
          fi
          echo "ksu_tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "ksu_commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building: $TAG @ $SHA"

      - name: Read pinned tag
        id: pinned
        if: steps.gate.outputs.proceed == 'true'
        run: |
          CURRENT=$(grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' kernelsu/README.md | head -1 || echo "none")
          echo "tag=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Skip if already current (non-forced dispatch)
        if: |
          steps.gate.outputs.proceed == 'true'
          && steps.resolve.outputs.ksu_tag == steps.pinned.outputs.tag
          && inputs.force != 'true'
          && github.event_name == 'workflow_dispatch'
        run: |
          echo "Already at ${{ steps.resolve.outputs.ksu_tag }} — set force=true to override."
          echo "proceed=false" >> "$GITHUB_OUTPUT"

  # ── Build matrix ───────────────────────────────────────────────────────────
  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: s25u-kdp
            kmi: android15-6.6
            ddk_image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
            kernel_release: 6.6.98-android15-8
            cargo_target: aarch64-linux-android35
          - target: A566EXXSCCZG6-kdp
            kmi: android15-6.6
            ddk_image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
            kernel_release: 6.6.102-android15-8
            cargo_target: aarch64-linux-android35
          - target: A366WVLS3AYG1-kdp
            kmi: android15-6.6
            ddk_image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
            kernel_release: 6.6.46-android15-8
            cargo_target: aarch64-linux-android35
          - target: e3q-S928USQS6DZF2-kdp
            kmi: android14-6.1
            ddk_image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
            kernel_release: 6.1.145-android14-11-33419968-abS928USQS6DZF2
            cargo_target: aarch64-linux-android35
          - target: e3q-S928BXXS6DZF2-kdp
            kmi: android14-6.1
            ddk_image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
            kernel_release: 6.1.145-android14-11
            cargo_target: aarch64-linux-android35
          - target: e2s-S926BXXUEDZDR-kdp
            kmi: android14-6.1
            ddk_image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
            kernel_release: 6.1.157-android14-11
            cargo_target: aarch64-linux-android35
          - target: e1s-S921BXXSFDZE1-kdp
            kmi: android14-6.1
            ddk_image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
            kernel_release: 6.1.157-android14-11
            cargo_target: aarch64-linux-android35
          - target: e1s-S921NKSSFDZF3-kdp
            kmi: android14-6.1
            ddk_image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
            kernel_release: 6.1.157-android14-11
            cargo_target: aarch64-linux-android35
          - target: dm3q-S9180ZHS8FZF5-kdp
            kmi: android13-5.15
            ddk_image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
            kernel_release: 5.15.189-android13-8
            cargo_target: aarch64-linux-android33
          - target: dm3q-S918BXXSAFZF5-kdp
            kmi: android13-5.15
            ddk_image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
            kernel_release: 5.15.189-android13-8
            cargo_target: aarch64-linux-android33
          - target: dm1q-S911U1UES6DYI3-kdp
            kmi: android13-5.15
            ddk_image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
            kernel_release: 5.15.153-android13-8
            cargo_target: aarch64-linux-android33
          - target: A536EXXSNGZG3-kdp
            kmi: android12-5.10
            ddk_image: ghcr.io/ylarod/ddk-min:android12-5.10-20260313
            kernel_release: 5.10.237-android12-9
            cargo_target: aarch64-linux-android31

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Cache the NDK installation by version so it is only downloaded once
      # across all matrix jobs and subsequent runs.
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/ndk/r29
          key: ndk-r29

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: true

      - name: Fix NDK clang symlink (r27+)
        run: |
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          # Fix bare clang → versioned clang-XX
          VERSIONED=$(ls "${NDK_BIN}/clang-"[0-9]* 2>/dev/null | head -1)
          if [ -n "${VERSIONED}" ]; then
            ln -sf "${VERSIONED}" "${NDK_BIN}/clang"
            echo "Symlink: clang -> $(basename ${VERSIONED})"
          else
            echo "::error::No versioned clang found in NDK bin"
            exit 1
          fi
          
          # Fix ld.lld → lld (NDK r27+ ships lld, not ld.lld)
          if [ ! -f "${NDK_BIN}/ld.lld" ]; then
            if [ -f "${NDK_BIN}/lld" ]; then
              ln -sf "${NDK_BIN}/lld" "${NDK_BIN}/ld.lld"
              echo "Symlink: ld.lld -> lld"
            else
              echo "::error::No lld found in NDK bin"
              ls "${NDK_BIN}/ld"* || true
              exit 1
            fi
          fi

      # Cache Cargo registry index + downloaded crate sources.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('KernelSU/Cargo.lock') }}
          restore-keys: cargo-registry-

      # Cache compiled Cargo artifacts per API-level target triple.
      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: KernelSU/target
          key: cargo-build-${{ matrix.cargo_target }}-${{ hashFiles('KernelSU/Cargo.lock') }}
          restore-keys: cargo-build-${{ matrix.cargo_target }}-

      - name: Checkout latest KernelSU at target tag
        uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: ${{ needs.gate.outputs.ksu_tag }}
          path: KernelSU
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Apply Samsung patch (auto-generate if missing or stale)
        env:
          KSU_TAG: ${{ needs.gate.outputs.ksu_tag }}
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          PATCH="${WS}/kernelsu/patches/KernelSU-${KSU_TAG}-samsung-kdp-rkp-defex.patch"

          # ── Helper: emit a full manual-rebase guide and fail the step. ─────
          # Called whenever a patch cannot apply cleanly.
          #
          # Args:
          #   $1  patch file that failed
          #   $2  dry-run output (already captured)
          fail_with_rebase_instructions() {
            local failed_patch="$1"
            local dry_out="$2"
            local patch_basename
            patch_basename=$(basename "${failed_patch}")

            # ── Print the raw failed-hunk details ───────────────────────────
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  MANUAL REBASE REQUIRED — patch cannot apply to ${KSU_TAG}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "▶ Patch:  ${patch_basename}"
            echo "▶ Target: tiann/KernelSU @ ${KSU_TAG}"
            echo ""
            echo "── Failed hunks (dry-run output) ───────────────────────────"
            echo "${dry_out}" | grep -E "FAILED|patching file|Hunk" || echo "(no hunk lines captured)"
            echo ""
            echo "── Full dry-run output ─────────────────────────────────────"
            echo "${dry_out}"
            echo ""

            # ── Option A: PowerShell (Windows) ──────────────────────────────
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  HOW TO FIX — Option A: PowerShell (Windows)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cat <<'PWSH'

          Prerequisites: Git for Windows (includes patch.exe), and either WSL or
          Git Bash for the patch command. Run the block below in Git Bash or WSL.

          # 1. Clone both repos side-by-side
          git clone https://github.com/tiann/KernelSU.git --branch ${KSU_TAG} --depth 1
          git clone https://github.com/TheFlood424K/Root-My-Galaxy-Payloads.git

          # 2. Copy the failing patch into the KernelSU tree
          Copy-Item "Root-My-Galaxy-Payloads\kernelsu\patches\${patch_basename}" `
                    "KernelSU\${patch_basename}"

          # 3. In Git Bash / WSL, attempt the dry-run to see every failed hunk
          cd KernelSU
          patch -p1 --dry-run < "${patch_basename}"

          # 4. Apply with rejection files so you can see exactly what failed
          patch -p1 --reject-file=samsung.rej < "${patch_basename}"
          # Open each *.rej file — it shows the context lines that no longer match.
          # Edit the corresponding source file to manually apply each hunk.

          # 5. Once all hunks are resolved, capture the new patch
          git diff HEAD > "../Root-My-Galaxy-Payloads/kernelsu/patches/KernelSU-${KSU_TAG}-samsung-kdp-rkp-defex.patch"

          # 6. Commit and push from PowerShell
          cd ..\Root-My-Galaxy-Payloads
          git add kernelsu\patches\KernelSU-${KSU_TAG}-samsung-kdp-rkp-defex.patch
          git commit -m "fix: rebase Samsung KDP/RKP/DEFEX patch onto ${KSU_TAG}"
          git push

          PWSH

            # ── Option B: GitHub web UI ─────────────────────────────────────
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  HOW TO FIX — Option B: GitHub web UI (no local tools)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cat <<WEBUI

          This option lets you edit the patch file directly in the browser.
          It works when only a small number of context lines changed (e.g. a
          function was moved a few lines up/down).

          1. Open the failing patch in the GitHub editor:
             https://github.com/TheFlood424K/Root-My-Galaxy-Payloads/edit/main/kernelsu/patches/${patch_basename}

          2. Open the changed KernelSU source file(s) listed in the dry-run
             output above in a second tab:
             https://github.com/tiann/KernelSU/tree/${KSU_TAG}

          3. For each FAILED hunk in the patch:
             a. Find the @@ -LINE,COUNT +LINE,COUNT @@ header.
             b. Navigate to that file and line number in the KernelSU source.
             c. Update the context lines (lines starting with a space) in the
                patch to match what is actually in ${KSU_TAG}.
             d. Update the @@ line numbers if lines shifted.

          4. Commit directly to main with message:
             fix: rebase Samsung KDP/RKP/DEFEX patch onto ${KSU_TAG}

          5. Re-run this workflow from:
             https://github.com/TheFlood424K/Root-My-Galaxy-Payloads/actions/workflows/rebuild-kernelsu.yml

          Note: if more than 2-3 hunks failed, use Option A instead — the web
          editor becomes error-prone for large patch edits.

          WEBUI

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "::error::Manual rebase required for ${patch_basename} against ${KSU_TAG}. See instructions above."
            exit 1
          }

          # ── Helper: use patch --dry-run to determine patch applicability. ──
          #
          # Returns:
          #   0  → all hunks are already applied (upstream merged)
          #   1  → patch applies cleanly (needs to be applied)
          #   2  → one or more hunks FAILED (stale/broken patch)
          #
          # IMPORTANT: all call sites must use `samsung_upstream_status ... || true`
          # so that set -e does not kill the script when the function returns 2.
          samsung_upstream_status() {
            local prev_patch="$1"
            local dry_out
            dry_out=$(patch -p1 --forward --dry-run < "${prev_patch}" 2>&1 || true)

            local failed reversed total_hunks
            failed=$(echo "${dry_out}"    | grep -c "FAILED"                              || true)
            reversed=$(echo "${dry_out}"  | grep -c "Reversed\|already exists\|previously applied" || true)
            total_hunks=$(echo "${dry_out}" | grep -c "^Hunk\|^patching file"             || true)

            echo "::debug::samsung_upstream_status failed=${failed} reversed=${reversed} total=${total_hunks}"

            if [ "${failed}" -gt 0 ]; then
              echo "::warning::Patch $(basename ${prev_patch}) has ${failed} FAILED hunk(s) against ${KSU_TAG}."
              # Store dry_out in a temp file so the caller can retrieve it for fail_with_rebase_instructions
              echo "${dry_out}" > /tmp/samsung_dry_out_last
              return 2
            fi

            # Clear the temp file on non-failure paths
            echo "" > /tmp/samsung_dry_out_last

            if [ "${reversed}" -gt 0 ] && [ "${failed}" -eq 0 ]; then
              echo "All ${total_hunks} hunk(s) already present in ${KSU_TAG} (upstream merge confirmed)."
              return 0
            fi

            # Patch applies cleanly — needs to be applied.
            return 1
          }

          # ── Resolve the patch to use: prefer versioned, fall back to prev ──
          # If the versioned patch exists but has failed hunks, treat it as
          # missing and fall through to the auto-generation path below.
          USE_PREV=false
          if [ -f "${PATCH}" ] && [ -s "${PATCH}" ]; then
            cd "${WS}/KernelSU"
            samsung_upstream_status "${PATCH}" || true   # || true: let set -e see $?, not abort on return 2
            VERSIONED_STATUS=$?
            cd "${WS}"

            if [ "${VERSIONED_STATUS}" -eq 2 ]; then
              echo "Versioned patch for ${KSU_TAG} has failed hunks — falling back to previous-patch rebase."
              USE_PREV=true
            fi
            # VERSIONED_STATUS 0 or 1 are handled further down as normal.
          fi

          if [ ! -f "${PATCH}" ] || [ ! -s "${PATCH}" ] || [ "${USE_PREV}" = "true" ]; then
            echo "No valid patch for ${KSU_TAG} — attempting auto-generation from previous version."

            # Find the most recent existing non-empty patch (by version sort),
            # excluding the current target patch if it exists but is stale.
            PREV_PATCH=$(ls -1 "${WS}/kernelsu/patches/KernelSU-v"*"-samsung-kdp-rkp-defex.patch" \
              2>/dev/null \
              | grep -v "KernelSU-${KSU_TAG}-" \
              | xargs -r grep -l . \
              | sort -V \
              | tail -1)

            if [ -z "${PREV_PATCH}" ]; then
              echo "::error::No previous Samsung patch found to rebase from."
              exit 1
            fi

            PREV_TAG=$(basename "${PREV_PATCH}" | grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+')
            echo "Checking previous patch (${PREV_TAG}) against ${KSU_TAG}: ${PREV_PATCH}"

            cd "${WS}/KernelSU"
            samsung_upstream_status "${PREV_PATCH}" || true   # || true: guard against set -e on return 2
            STATUS=$?

            if [ "${STATUS}" -eq 2 ]; then
              SAVED_DRY_OUT=$(cat /tmp/samsung_dry_out_last)
              fail_with_rebase_instructions "${PREV_PATCH}" "${SAVED_DRY_OUT}"
            fi

            if [ "${STATUS}" -eq 0 ]; then
              echo "Samsung KDP/RKP/DEFEX fully merged in ${KSU_TAG} — creating empty sentinel patch."
              touch "${PATCH}"
              cd "${WS}"
              echo "Sentinel written to ${PATCH}"
              exit 0
            fi

            # STATUS == 1: patch applies cleanly — apply and capture as new versioned patch.
            echo "Rebasing ${PREV_TAG} Samsung patch onto ${KSU_TAG}."
            if patch -p1 --forward --reject-file=- < "${PREV_PATCH}"; then
              echo "Patch applied cleanly to ${KSU_TAG}."
            else
              echo "::error::Patch failed to apply to ${KSU_TAG} (unexpected after clean dry-run)."
              exit 1
            fi

            git diff HEAD > "${PATCH}"
            git checkout -- .
            cd "${WS}"
            echo "Generated patch saved to ${PATCH}"
          fi

          # ── Apply the versioned patch (skip if sentinel / empty) ──────────
          if [ ! -s "${PATCH}" ]; then
            echo "Sentinel patch for ${KSU_TAG} — Samsung changes already upstream, nothing to apply."
            exit 0
          fi

          echo "Applying ${PATCH} to KernelSU ${KSU_TAG}"
          cd "${WS}/KernelSU"

          # Final safety dry-run before real apply.
          samsung_upstream_status "${PATCH}" || true   # || true: guard against set -e on return 2
          APPLY_STATUS=$?
          if [ "${APPLY_STATUS}" -eq 2 ]; then
            SAVED_DRY_OUT=$(cat /tmp/samsung_dry_out_last)
            fail_with_rebase_instructions "${PATCH}" "${SAVED_DRY_OUT}"
          fi
          if [ "${APPLY_STATUS}" -eq 0 ]; then
            echo "Versioned patch already fully applied in ${KSU_TAG} — skipping apply step."
            exit 0
          fi

          if patch -p1 --forward --reject-file=- < "${PATCH}"; then
            echo "Patch applied successfully."
          else
            DRY_OUT=$(patch -p1 --forward --dry-run < "${PATCH}" 2>&1 || true)
            fail_with_rebase_instructions "${PATCH}" "${DRY_OUT}"
          fi

      - name: Build .ko inside DDK container
        env:
          KMI:            ${{ matrix.kmi }}
          KERNEL_RELEASE: ${{ matrix.kernel_release }}
          DDK_IMAGE:      ${{ matrix.ddk_image }}
        run: |
          mkdir -p out
          docker run --rm \
            -e KERNEL_RELEASE="${KERNEL_RELEASE}" \
            -v "$PWD/KernelSU:/workspace" \
            -w /workspace \
            "$DDK_IMAGE" \
            bash -lc '
              set -euo pipefail
              find "$KDIR/include/generated" "$KDIR/include/config" \
                \( -name "utsrelease.h" -o -name "kernel.release" \) 2>/dev/null \
                | xargs -r sed -i "s|[0-9][^ \"]*dirty|${KERNEL_RELEASE}|g"
              make -C "$KDIR" M="$PWD/kernel" src="$PWD/kernel" \
                ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                CONFIG_KSU=m \
                CONFIG_KSU_SAMSUNG_KDP=y \
                CONFIG_KSU_SAMSUNG_RKP=y \
                CONFIG_KSU_SAMSUNG_DEFEX=y \
                KBUILD_MODPOST_WARN=1 modules
              modinfo kernel/kernelsu.ko
              llvm-strip -d kernel/kernelsu.ko
            '
          cp KernelSU/kernel/kernelsu.ko "out/${KMI}_kernelsu-${{ matrix.target }}.ko"

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev

      - name: Build ksud
        env:
          KMI:          ${{ matrix.kmi }}
          CARGO_TARGET: ${{ matrix.cargo_target }}
          ANDROID_NDK:  ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="${NDK_BIN}:${PATH}"
          export LIBCLANG_PATH="$(llvm-config --libdir)"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_BIN}/${CARGO_TARGET}-clang"
          export CC_aarch64_linux_android="${NDK_BIN}/${CARGO_TARGET}-clang"
          export AR_aarch64_linux_android="${NDK_BIN}/llvm-ar"
          cp "out/${KMI}_kernelsu-${{ matrix.target }}.ko" \
             "KernelSU/userspace/ksud/bin/aarch64/${KMI}_kernelsu.ko"
          cd KernelSU
          cargo build --release --target aarch64-linux-android -p ksud
          cp "${GITHUB_WORKSPACE}/KernelSU/target/aarch64-linux-android/release/ksud" \
             "${GITHUB_WORKSPACE}/out/ksud-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksud-${{ matrix.target }}
          path: |
            out/ksud-${{ matrix.target }}
            out/${{ matrix.kmi }}_kernelsu-${{ matrix.target }}.ko
          retention-days: 7

  # ── Commit rebuilt artifacts back to main ─────────────────────────────────
  commit:
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-dl
          merge-multiple: true

      - name: Install files and update metadata
        env:
          KSU_TAG:    ${{ needs.gate.outputs.ksu_tag }}
          KSU_COMMIT: ${{ needs.gate.outputs.ksu_commit }}
        run: |
          set -euo pipefail

          for f in artifacts-dl/ksud-*; do
            name=$(basename "$f")
            cp "$f" "kernelsu/${name}"
            echo "  kernelsu/${name}: $(stat -c %s kernelsu/${name}) bytes"
          done
          for f in artifacts-dl/*.ko; do
            name=$(basename "$f")
            cp "$f" "kernelsu/${name}"
            echo "  kernelsu/${name}: $(stat -c %s kernelsu/${name}) bytes"
          done

          # Update pinned-version line in README
          sed -i \
            "s|KernelSU \`v[0-9]\+\.[0-9]\+\.[0-9]\+\`, commit|KernelSU \`${KSU_TAG}\`, commit|" \
            kernelsu/README.md
          sed -i \
            "s|\`[0-9a-f]\{40\}\`|\`${KSU_COMMIT}\`|" \
            kernelsu/README.md

          python3 - <<'PYEOF'
          import json, os, re, urllib.request

          with open("support/targets-v3.json") as f:
              data = json.load(f)

          for payload in data["payloads"]:
              ksu = payload.get("kernelsu", {})
              fname = ksu.get("url", "").split("/")[-1]
              local = os.path.join("kernelsu", fname)
              if os.path.isfile(local):
                  ksu["size"] = os.path.getsize(local)

          meta = json.loads(urllib.request.urlopen(
              "https://api.github.com/repos/tiann/KernelSU/releases/latest"
          ).read())
          apk = next((a for a in meta["assets"] if a["name"].endswith("-release.apk")), None)
          if apk:
              vc = re.search(r'_(\d+)-release', apk["name"])
              data["kernelsuManager"] = {
                  "version":             meta["tag_name"],
                  "versionCode":         int(vc.group(1)) if vc else 0,
                  "latestReleaseApiUrl": "https://api.github.com/repos/tiann/KernelSU/releases/latest",
                  "apkUrl":              apk["browser_download_url"],
              }

          with open("support/targets-v3.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PYEOF

      - name: Commit and push
        env:
          KSU_TAG: ${{ needs.gate.outputs.ksu_tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kernelsu/ support/targets-v3.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: rebuild KernelSU binaries for ${KSU_TAG}"
            git push
          fi
